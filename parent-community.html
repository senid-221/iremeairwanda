<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Parent Community</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .parent-card { transition: all 0.3s; }
        .parent-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="parentCommunity.title">School Parent Community</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="parentCommunity.title">Parent Community</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Stats Start -->
    <div class="container-fluid py-4 bg-light">
        <div class="container">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="bg-white rounded p-4 text-center shadow-sm">
                        <h2 class="text-primary mb-1" id="stat-total">0</h2>
                        <small class="text-muted" data-i18n="parentCommunity.total">Total Parents</small>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="bg-white rounded p-4 text-center shadow-sm">
                        <h2 class="text-success mb-1" id="stat-active">0</h2>
                        <small class="text-muted" data-i18n="parentCommunity.active">Active Members</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Stats End -->

    <!-- Community List Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <!-- Search -->
            <div class="row g-3 mb-4">
                <div class="col-md-8 mx-auto">
                    <input type="text" id="search-input" class="form-control rounded-pill px-4 py-2" data-i18n-placeholder="parentCommunity.search" placeholder="Search parents...">
                </div>
            </div>

            <!-- Parents Grid -->
            <div id="parents-list" class="row g-4">
                <div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>

            <!-- Empty State -->
            <div id="parents-empty" class="text-center py-5" style="display:none">
                <i class="fa fa-users fa-3x text-muted mb-3"></i>
                <h4 data-i18n="parentCommunity.noParents">No parents found</h4>
            </div>
        </div>
    </div>
    <!-- Community List End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('parent-community.html');
        IremeAuth.requireAuth();

        var allParents = [];

        function loadCommunity() {
            IremeAPI.getParentCommunity().then(function(data) {
                allParents = data.parents || data.members || [];
                updateStats();
                displayParents(allParents);
            }).catch(function(err) {
                console.error('Failed to load community:', err);
                document.getElementById('parents-list').innerHTML = '';
                document.getElementById('parents-empty').style.display = 'block';
            });
        }

        function updateStats() {
            var total = allParents.length;
            var active = allParents.filter(function(p) { return p.active !== false; }).length;
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-active').textContent = active;
        }

        function displayParents(parents) {
            var container = document.getElementById('parents-list');
            var emptyState = document.getElementById('parents-empty');

            if (parents.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = parents.map(function(p) {
                var initials = (p.firstName || 'P')[0] + (p.lastName || '')[0];
                var childClass = p.childClass || p.childClassName || '';

                return '<div class="col-md-6 col-lg-4 wow fadeInUp" data-wow-delay="0.1s">' +
                    '<div class="parent-card bg-white rounded shadow-sm p-4 h-100">' +
                    '<div class="d-flex align-items-center mb-3">' +
                    '<div class="flex-shrink-0 bg-primary rounded-circle d-flex align-items-center justify-content-center text-white fw-bold" style="width:56px;height:56px;font-size:18px">' +
                    initials +
                    '</div>' +
                    '<div class="flex-grow-1 ms-3">' +
                    '<h6 class="mb-0">' + (p.firstName || '') + ' ' + (p.lastName || '') + '</h6>' +
                    (childClass ? '<small class="text-muted"><i class="fa fa-child me-1"></i>' + IremeI18n.t('parentCommunity.childInClass') + ' ' + childClass + '</small>' : '') +
                    '</div>' +
                    '</div>' +
                    (p.phone ? '<p class="text-muted small mb-1"><i class="fa fa-phone me-1"></i> ' + p.phone + '</p>' : '') +
                    (p.email ? '<p class="text-muted small mb-2"><i class="fa fa-envelope me-1"></i> ' + p.email + '</p>' : '') +
                    '<div class="d-flex gap-2 mt-2">' +
                    (p.phone ? '<a href="tel:' + p.phone + '" class="btn btn-outline-primary btn-sm rounded-pill flex-grow-1"><i class="fa fa-phone me-1"></i>Call</a>' : '') +
                    (p.email ? '<a href="mailto:' + p.email + '" class="btn btn-primary btn-sm rounded-pill flex-grow-1"><i class="fa fa-envelope me-1"></i><span data-i18n="parentCommunity.sendMessage">Message</span></a>' : '') +
                    '</div>' +
                    '</div></div>';
            }).join('');
        }

        function filterParents() {
            var search = document.getElementById('search-input').value.toLowerCase();
            var filtered = allParents.filter(function(p) {
                var name = ((p.firstName || '') + ' ' + (p.lastName || '')).toLowerCase();
                return !search || name.indexOf(search) !== -1 || (p.email || '').toLowerCase().indexOf(search) !== -1;
            });
            displayParents(filtered);
        }

        document.getElementById('search-input').addEventListener('input', filterParents);

        loadCommunity();
    </script>
</body>
</html>
