<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>IREME - Quizzes</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="IREME Quizzes, Practice Tests, Rwanda, Curriculum, Assessment" name="keywords">
    <meta content="Take curriculum-aligned quizzes with instant feedback and scoring. Track your progress and improve your knowledge." name="description">

    <!-- Favicon -->
    <link href="img/ireme-icon.png" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <style>
        .quiz-card {
            transition: all 0.3s;
            cursor: pointer;
        }
        .quiz-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .quiz-option {
            transition: all 0.2s;
        }
        .quiz-option:hover {
            background-color: #f8f9fa;
            border-color: var(--primary);
        }
        .quiz-option.selected {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .quiz-option.correct {
            background-color: #12B981;
            color: white;
            border-color: #12B981;
        }
        .quiz-option.incorrect {
            background-color: #e35656;
            color: white;
            border-color: #e35656;
        }
    </style>
</head>

<body>
    <div id="component-spinner"></div>

    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="quizzes.title">Quizzes</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="quizzes.title">Quizzes</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Quiz Selection Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <div class="text-center mx-auto mb-5 wow fadeInUp" data-wow-delay="0.1s" style="max-width: 600px;">
                <h1 class="display-6" data-i18n="quizzes.selectQuiz">Select a Quiz</h1>
                <p class="text-muted" data-i18n="quizzes.selectQuizDesc">Choose a subject and level to start practicing</p>
            </div>

            <!-- Filters -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <select id="quiz-level" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="quizzes.selectLevel">Select Level</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="quiz-subject" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="quizzes.selectSubject">Select Subject</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="quiz-difficulty" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="quizzes.allDifficulties">All Difficulties</option>
                        <option value="easy" data-i18n="quizzes.easy">Easy</option>
                        <option value="medium" data-i18n="quizzes.medium">Medium</option>
                        <option value="hard" data-i18n="quizzes.hard">Hard</option>
                    </select>
                </div>
            </div>

            <!-- Quiz List -->
            <div id="quiz-list" class="row g-4">
                <!-- Quizzes will be loaded here -->
            </div>

            <!-- Empty State -->
            <div id="quiz-empty" class="text-center py-5" style="display: none;">
                <i class="fa fa-question-circle fa-3x text-muted mb-3"></i>
                <h4 data-i18n="quizzes.noQuizzes">No quizzes available</h4>
                <p class="text-muted" data-i18n="quizzes.noQuizzesDesc">Try selecting a different subject or level</p>
            </div>
        </div>
    </div>
    <!-- Quiz Selection End -->

    <!-- Quiz Taking Modal -->
    <div class="modal fade" id="quizModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="quizModalTitle">Quiz</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="quiz-progress" class="mb-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span id="quiz-question-num">Question 1</span>
                            <span id="quiz-timer">00:00</span>
                        </div>
                        <div class="progress" style="height: 8px;">
                            <div id="quiz-progress-bar" class="progress-bar bg-primary" style="width: 0%"></div>
                        </div>
                    </div>
                    <div id="quiz-question" class="mb-4">
                        <h5 id="quiz-question-text"></h5>
                    </div>
                    <div id="quiz-options" class="vstack gap-2">
                        <!-- Options will be loaded here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="quizzes.cancel">Cancel</button>
                    <button type="button" class="btn btn-primary" id="quiz-next-btn" data-i18n="quizzes.next">Next</button>
                    <button type="button" class="btn btn-success" id="quiz-submit-btn" style="display: none;" data-i18n="quizzes.submit">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Results Modal -->
    <div class="modal fade" id="resultsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" data-i18n="quizzes.results">Quiz Results</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="mb-4">
                        <i class="fa fa-trophy fa-4x text-warning mb-3"></i>
                        <h2 id="results-score">0/0</h2>
                        <p class="text-muted" id="results-percentage">0%</p>
                    </div>
                    <div id="results-details" class="text-start">
                        <!-- Detailed results will be shown here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="quizzes.close">Close</button>
                    <button type="button" class="btn btn-primary" id="results-retry-btn" data-i18n="quizzes.retry">Retry Quiz</button>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>

    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        IremeComponents.initPage('quizzes.html');
        IremeAuth.requireAuth();

        var quizState = {
            questions: [],
            currentQuestion: 0,
            answers: [],
            startTime: null,
            timerInterval: null,
            selectedQuiz: null
        };

        // Load levels and subjects
        function loadFilters() {
            IremeAPI.getCurriculumLevels().then(function(data) {
                var levels = data.levels || [];
                var select = document.getElementById('quiz-level');
                levels.forEach(function(level) {
                    var option = document.createElement('option');
                    option.value = level.id;
                    option.textContent = level.name;
                    select.appendChild(option);
                });
            });

            IremeAPI.getCurriculumSubjects().then(function(data) {
                var subjects = data.subjects || [];
                var select = document.getElementById('quiz-subject');
                subjects.forEach(function(subject) {
                    var option = document.createElement('option');
                    option.value = subject.id;
                    option.textContent = subject.name || subject.nameEn;
                    select.appendChild(option);
                });
            });
        }

        // Load quizzes based on filters
        function loadQuizzes() {
            var level = document.getElementById('quiz-level').value;
            var subject = document.getElementById('quiz-subject').value;
            var difficulty = document.getElementById('quiz-difficulty').value;

            var params = { limit: 50 };
            if (level) params.level = level;
            if (subject) params.subjectId = subject;
            if (difficulty) params.difficulty = difficulty;

            IremeAPI.getQuestions(params).then(function(data) {
                var questions = data.questions || [];
                displayQuizzes(questions);
            }).catch(function(err) {
                console.error('Failed to load quizzes:', err);
                document.getElementById('quiz-list').innerHTML = '';
                document.getElementById('quiz-empty').style.display = 'block';
            });
        }

        // Display quiz cards
        function displayQuizzes(questions) {
            var container = document.getElementById('quiz-list');
            var emptyState = document.getElementById('quiz-empty');

            if (questions.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            // Group questions by subject and create quiz cards
            var quizMap = {};
            questions.forEach(function(q) {
                var key = q.questionBank ? q.questionBank.subjectId : 'general';
                if (!quizMap[key]) {
                    quizMap[key] = {
                        subject: q.questionBank ? q.questionBank.subjectId : 'General',
                        subjectName: q.questionBank ? q.questionBank.name : 'General',
                        level: q.questionBank ? q.questionBank.level : '',
                        count: 0,
                        questions: []
                    };
                }
                quizMap[key].count++;
                quizMap[key].questions.push(q);
            });

            var html = Object.values(quizMap).map(function(quiz) {
                return '<div class="col-md-6 col-lg-4 wow fadeInUp" data-wow-delay="0.1s">' +
                    '<div class="quiz-card bg-white rounded shadow-sm p-4 h-100" onclick="startQuiz(\'' + quiz.subject + '\')">' +
                    '<div class="d-flex align-items-center mb-3">' +
                    '<div class="flex-shrink-0 bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">' +
                    '<i class="fa fa-question-circle text-white"></i>' +
                    '</div>' +
                    '<div class="flex-grow-1 ms-3">' +
                    '<h5 class="mb-0">' + quiz.subjectName + '</h5>' +
                    '<small class="text-muted">' + quiz.count + ' questions</small>' +
                    '</div>' +
                    '</div>' +
                    '<p class="text-muted small mb-0">Level: ' + (quiz.level || 'All') + '</p>' +
                    '</div>' +
                    '</div>';
            }).join('');

            container.innerHTML = html;
        }

        // Start quiz
        function startQuiz(subjectKey) {
            var level = document.getElementById('quiz-level').value;
            var subject = document.getElementById('quiz-subject').value;

            var params = { limit: 10 };
            if (level) params.level = level;
            if (subject) params.subjectId = subject;

            IremeAPI.getQuestions(params).then(function(data) {
                var questions = data.questions || [];
                if (questions.length === 0) {
                    alert('No questions available for this selection');
                    return;
                }

                quizState.questions = questions;
                quizState.currentQuestion = 0;
                quizState.answers = [];
                quizState.startTime = Date.now();
                quizState.selectedQuiz = subjectKey;

                startTimer();
                showQuestion();
                var modal = new bootstrap.Modal(document.getElementById('quizModal'));
                modal.show();
            });
        }

        // Show current question
        function showQuestion() {
            var q = quizState.questions[quizState.currentQuestion];
            var total = quizState.questions.length;
            var current = quizState.currentQuestion + 1;

            document.getElementById('quiz-question-num').textContent = 'Question ' + current + ' of ' + total;
            document.getElementById('quiz-progress-bar').style.width = ((current / total) * 100) + '%';
            document.getElementById('quiz-question-text').textContent = q.questionTextEn || q.questionText || q.questionTextRw;

            var optionsHtml = (q.questionOptions || []).map(function(opt, idx) {
                return '<div class="quiz-option border rounded p-3" onclick="selectOption(' + idx + ')">' +
                    '<strong>' + String.fromCharCode(65 + idx) + '.</strong> ' + (opt.optionTextEn || opt.optionText || opt.optionTextRw) +
                    '</div>';
            }).join('');

            document.getElementById('quiz-options').innerHTML = optionsHtml;

            // Show/hide submit button
            document.getElementById('quiz-next-btn').style.display = current < total ? 'inline-block' : 'none';
            document.getElementById('quiz-submit-btn').style.display = current === total ? 'inline-block' : 'none';
        }

        // Select option
        function selectOption(idx) {
            quizState.answers[quizState.currentQuestion] = idx;
            document.querySelectorAll('.quiz-option').forEach(function(opt, i) {
                opt.classList.toggle('selected', i === idx);
            });
        }

        // Next question
        document.getElementById('quiz-next-btn').addEventListener('click', function() {
            if (quizState.answers[quizState.currentQuestion] === undefined) {
                alert('Please select an answer');
                return;
            }
            quizState.currentQuestion++;
            showQuestion();
        });

        // Submit quiz
        document.getElementById('quiz-submit-btn').addEventListener('click', function() {
            if (quizState.answers[quizState.currentQuestion] === undefined) {
                alert('Please select an answer');
                return;
            }
            stopTimer();
            submitQuiz();
        });

        // Timer
        function startTimer() {
            quizState.timerInterval = setInterval(function() {
                var elapsed = Math.floor((Date.now() - quizState.startTime) / 1000);
                var minutes = Math.floor(elapsed / 60);
                var seconds = elapsed % 60;
                document.getElementById('quiz-timer').textContent = 
                    String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            }, 1000);
        }

        function stopTimer() {
            if (quizState.timerInterval) {
                clearInterval(quizState.timerInterval);
                quizState.timerInterval = null;
            }
        }

        // Submit and show results
        function submitQuiz() {
            var correct = 0;
            var total = quizState.questions.length;

            quizState.questions.forEach(function(q, idx) {
                var userAnswer = quizState.answers[idx];
                var correctAnswer = (q.questionOptions || []).findIndex(function(opt) { return opt.isCorrect; });
                if (userAnswer === correctAnswer) correct++;
            });

            var percentage = Math.round((correct / total) * 100);

            document.getElementById('results-score').textContent = correct + '/' + total;
            document.getElementById('results-percentage').textContent = percentage + '%';

            // Show detailed results
            var detailsHtml = quizState.questions.map(function(q, idx) {
                var userAnswer = quizState.answers[idx];
                var correctAnswer = (q.questionOptions || []).findIndex(function(opt) { return opt.isCorrect; });
                var isCorrect = userAnswer === correctAnswer;
                var icon = isCorrect ? 'fa-check-circle text-success' : 'fa-times-circle text-danger';

                return '<div class="mb-3 p-3 border rounded">' +
                    '<div class="d-flex align-items-start mb-2">' +
                    '<i class="fa ' + icon + ' me-2 mt-1"></i>' +
                    '<div>' +
                    '<strong>Q' + (idx + 1) + ':</strong> ' + (q.questionTextEn || q.questionText || '') +
                    '</div>' +
                    '</div>' +
                    '<small class="text-muted ms-4">Your answer: ' + (userAnswer >= 0 ? String.fromCharCode(65 + userAnswer) : 'Not answered') + 
                    ' | Correct: ' + String.fromCharCode(65 + correctAnswer) + '</small>' +
                    '</div>';
            }).join('');

            document.getElementById('results-details').innerHTML = detailsHtml;

            // Close quiz modal and show results
            bootstrap.Modal.getInstance(document.getElementById('quizModal')).hide();
            var resultsModal = new bootstrap.Modal(document.getElementById('resultsModal'));
            resultsModal.show();

            // Save results to backend
            saveQuizResults(correct, total, percentage);
        }

        // Save results to backend
        function saveQuizResults(correct, total, percentage) {
            if (!IremeAuth.isLoggedIn()) return;

            IremeAPI.saveQuizAttempt({
                subjectId: quizState.selectedQuiz,
                score: correct,
                total: total,
                percentage: percentage,
                duration: Math.floor((Date.now() - quizState.startTime) / 1000)
            }).catch(function(err) {
                console.error('Failed to save quiz results:', err);
            });
        }

        // Retry quiz
        document.getElementById('results-retry-btn').addEventListener('click', function() {
            bootstrap.Modal.getInstance(document.getElementById('resultsModal')).hide();
            startQuiz(quizState.selectedQuiz);
        });

        // Filter change handlers
        document.getElementById('quiz-level').addEventListener('change', loadQuizzes);
        document.getElementById('quiz-subject').addEventListener('change', loadQuizzes);
        document.getElementById('quiz-difficulty').addEventListener('change', loadQuizzes);

        // Initialize
        loadFilters();
        loadQuizzes();
    </script>
</body>

</html>
