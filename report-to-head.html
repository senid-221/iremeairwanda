<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Report to Headteacher</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="reportHead.title">Report to Headteacher</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="reportHead.title">Report to Head</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>

    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="bg-light rounded p-4">
                        <h4 class="mb-4"><i class="fa fa-user-tie text-primary me-2"></i><span data-i18n="reportHead.desc">Submit professional reports to the headteacher</span></h4>
                        <form id="head-report-form">
                            <div class="mb-3">
                                <label class="form-label" data-i18n="reportHead.reportType">Report Type</label>
                                <select id="hr-type" class="form-select" required>
                                    <option value="class" data-i18n="reportHead.classReport">Class Report</option>
                                    <option value="incident" data-i18n="reportHead.incidentReport">Incident Report</option>
                                    <option value="progress" data-i18n="reportHead.progressReport">Progress Report</option>
                                    <option value="general" data-i18n="reportHead.generalReport">General Report</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" data-i18n="reportHead.subject">Subject</label>
                                <input type="text" id="hr-subject" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" data-i18n="reportHead.details">Details</label>
                                <textarea id="hr-details" class="form-control" rows="6" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary rounded-pill px-4"><i class="fa fa-paper-plane me-1"></i> <span data-i18n="reportHead.submit">Submit Report</span></button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="bg-light rounded p-4">
                        <h4 class="mb-3" data-i18n="reportHead.recent">Recent Reports</h4>
                        <div id="head-reports-list"></div>
                        <div id="head-reports-empty" class="text-center py-3">
                            <p class="text-muted" data-i18n="reportHead.noReports">No reports submitted yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('report-to-head.html');
        IremeAuth.requireRole('teacher');

        document.getElementById('head-report-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var data = {
                reportType: document.getElementById('hr-type').value,
                subject: document.getElementById('hr-subject').value,
                details: document.getElementById('hr-details').value,
                type: 'head'
            };
            IremeAPI.sendReportToHead(data).then(function() {
                alert('Report submitted to headteacher successfully');
                document.getElementById('head-report-form').reset();
                loadRecent();
            }).catch(function(e) { alert('Error: ' + (e.message || 'Could not submit report')); });
        });

        function loadRecent() {
            IremeAPI.getTeacherReports().then(function(data) {
                var reports = (data.reports || []).filter(function(r) { return r.type === 'head'; });
                if (reports.length === 0) return;
                document.getElementById('head-reports-empty').style.display = 'none';
                document.getElementById('head-reports-list').innerHTML = reports.slice(0, 5).map(function(r) {
                    var date = r.createdAt ? new Date(r.createdAt).toLocaleDateString() : '';
                    var typeColor = r.reportType === 'incident' ? 'bg-danger' : r.reportType === 'class' ? 'bg-primary' : 'bg-info';
                    return '<div class="border-bottom py-2 mb-2"><div class="d-flex justify-content-between">' +
                        '<strong>' + (r.subject || 'Report') + '</strong><span class="badge ' + typeColor + '">' + (r.reportType || '') + '</span></div>' +
                        '<small class="text-muted">' + date + '</small>' +
                        '<p class="small mb-0 mt-1">' + (r.details || '').substring(0, 80) + '</p></div>';
                }).join('');
            }).catch(function() {});
        }

        loadRecent();
    </script>
</body>
</html>
