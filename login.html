<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Log In</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-8 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-3 animated slideInRight" data-i18n="auth.choosePortal">Choose Your Portal</h1>
                    <p class="text-white mb-0" data-i18n="auth.choosePortalDesc">Select the portal that matches your role to access your dashboard.</p>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" data-i18n="auth.login">Log In</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Portal Selection -->
    <div class="container-fluid py-5">
        <div class="container py-5">
            <div class="row g-4 justify-content-center" id="portal-grid">
            </div>

            <div class="text-center mt-5">
                <p class="text-muted mb-2" data-i18n="auth.noAccount">Don't have an account?</p>
                <a href="register.html" class="btn btn-primary rounded-pill px-4" data-i18n="auth.registerHere">Register here</a>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script>
        IremeComponents.initPage('login.html');

        function renderPortals() {
            var grid = document.getElementById('portal-grid');
            if (!grid || typeof IremeAuth === 'undefined') return;

            var portals = IremeAuth.PORTALS;
            var html = '';
            portals.forEach(function(p, i) {
                var role = IremeAuth.ROLES[p.id];
                if (!role) return;
                var lang = localStorage.getItem('ireme-lang') || 'en';
                var label = lang === 'rw'
                    ? (IremeAuth.ROLES[p.id].label || p.id)
                    : role.label;
                var portalI18nKey = {
                    student: 'auth.studentPortal',
                    teacher: 'auth.teacherPortal',
                    parent: 'auth.parentPortal',
                    school_admin: 'auth.schoolPortal',
                    learner: 'auth.learnerPortal',
                    admin: 'auth.adminPortal'
                };
                var descI18nKey = {
                    student: 'auth.studentDesc',
                    teacher: 'auth.teacherDesc',
                    parent: 'auth.parentDesc',
                    school_admin: 'auth.schoolDesc',
                    learner: 'auth.learnerDesc',
                    admin: 'auth.adminDesc'
                };
                var loginPages = {
                    student: 'student-login.html',
                    teacher: 'teacher-login.html',
                    parent: 'parent-login.html',
                    school_admin: 'school-login.html',
                    learner: 'learner-login.html',
                    admin: 'admin-login.html'
                };
                var delay = (i * 0.1 + 0.1).toFixed(1);
                html += '<div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay="' + delay + 's">' +
                    '<a href="' + loginPages[p.id] + '" class="text-decoration-none">' +
                    '<div class="service-item text-center rounded p-4 h-100">' +
                    '<div class="service-icon btn-square rounded-circle mb-3"><i class="fa ' + p.icon + ' fa-lg"></i></div>' +
                    '<h5 class="mb-2" data-i18n="' + portalI18nKey[p.id] + '">' + label + '</h5>' +
                    '<p class="text-muted small mb-0" data-i18n="' + descI18nKey[p.id] + '">' + (role.label) + '</p>' +
                    '</div></a></div>';
            });
            grid.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (IremeAuth.isLoggedIn()) {
                IremeAuth.redirectToDashboard();
                return;
            }
            setTimeout(renderPortals, 100);
        });
    </script>
</body>
</html>
