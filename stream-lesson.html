<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Stream Lesson</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="streamLesson.title">Stream Lesson</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="streamLesson.title">Stream Lesson</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>

    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <div class="bg-white rounded shadow-sm p-4 text-center h-100">
                        <i class="fa fa-video fa-3x text-primary mb-3"></i>
                        <h4 data-i18n="streamLesson.startStream">Start Live Lesson</h4>
                        <p class="text-muted">Start an immediate live lesson for your students</p>
                        <button class="btn btn-primary rounded-pill px-4" id="start-live-btn">
                            <i class="fa fa-broadcast-tower me-1"></i> Go Live Now
                        </button>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="bg-white rounded shadow-sm p-4 text-center h-100">
                        <i class="fa fa-calendar-plus fa-3x text-success mb-3"></i>
                        <h4 data-i18n="streamLesson.scheduleStream">Schedule Lesson</h4>
                        <p class="text-muted">Schedule a lesson for a future date and time</p>
                        <button class="btn btn-success rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#scheduleModal">
                            <i class="fa fa-calendar me-1"></i> Schedule
                        </button>
                    </div>
                </div>
            </div>

            <h3 class="mb-3" data-i18n="streamLesson.upcoming">Upcoming Lessons</h3>
            <div id="streams-list" class="row g-4"></div>
            <div id="streams-empty" class="text-center py-5" style="display:none;">
                <i class="fa fa-video-slash fa-3x text-muted mb-3"></i>
                <h4 data-i18n="streamLesson.noStreams">No scheduled lessons</h4>
                <p class="text-muted" data-i18n="streamLesson.noStreamsDesc">Schedule a live lesson to get started</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="scheduleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" data-i18n="streamLesson.scheduleStream">Schedule Lesson</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Lesson Title</label>
                        <input type="text" id="sched-title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="streamLesson.dateTime">Date & Time</label>
                        <input type="datetime-local" id="sched-datetime" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="streamLesson.duration">Duration (minutes)</label>
                        <input type="number" id="sched-duration" class="form-control" value="40">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="schedule-btn">Schedule</button>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('stream-lesson.html');
        IremeAuth.requireRole('teacher');

        function loadStreams() {
            IremeAPI.getMeetings().then(function(data) {
                var meetings = (data.meetings || []).filter(function(m) { return m.type === 'lesson' || m.isLesson; });
                displayStreams(meetings);
            }).catch(function() { displayStreams([]); });
        }

        function displayStreams(streams) {
            var container = document.getElementById('streams-list');
            var empty = document.getElementById('streams-empty');
            if (streams.length === 0) { container.innerHTML = ''; empty.style.display = 'block'; return; }
            empty.style.display = 'none';
            container.innerHTML = streams.map(function(s) {
                var isLive = s.status === 'live' || s.status === 'active';
                var badge = isLive ? '<span class="badge bg-danger"><i class="fa fa-circle me-1"></i>LIVE</span>' :
                    s.status === 'ended' ? '<span class="badge bg-secondary">Ended</span>' :
                    '<span class="badge bg-info">Scheduled</span>';
                var date = s.scheduledAt ? new Date(s.scheduledAt).toLocaleString() : '';
                return '<div class="col-md-6 col-lg-4"><div class="bg-white rounded shadow-sm p-4 h-100">' +
                    '<div class="d-flex justify-content-between mb-2"><h5 class="mb-0">' + (s.title || 'Lesson') + '</h5>' + badge + '</div>' +
                    '<p class="text-muted small mb-2"><i class="fa fa-calendar me-1"></i>' + date + '</p>' +
                    '<p class="text-muted small mb-3"><i class="fa fa-users me-1"></i>' + (s.participantCount || 0) + ' students</p>' +
                    (isLive ? '<button class="btn btn-danger rounded-pill btn-sm px-3"><i class="fa fa-play me-1"></i>Join Live</button>' : '') +
                    '</div></div>';
            }).join('');
        }

        document.getElementById('start-live-btn').addEventListener('click', function() {
            IremeAPI.createMeeting({ title: 'Live Lesson', type: 'lesson', scheduledAt: new Date().toISOString() }).then(function() {
                loadStreams();
            }).catch(function(e) { alert('Error: ' + (e.message || 'Could not start lesson')); });
        });

        document.getElementById('schedule-btn').addEventListener('click', function() {
            var data = {
                title: document.getElementById('sched-title').value,
                type: 'lesson',
                scheduledAt: new Date(document.getElementById('sched-datetime').value).toISOString(),
                durationMinutes: parseInt(document.getElementById('sched-duration').value)
            };
            IremeAPI.createMeeting(data).then(function() {
                bootstrap.Modal.getInstance(document.getElementById('scheduleModal')).hide();
                loadStreams();
            }).catch(function(e) { alert('Error: ' + (e.message || 'Could not schedule')); });
        });

        loadStreams();
    </script>
</body>
</html>
