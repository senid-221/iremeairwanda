<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Available Teachers</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .teacher-card { transition: all 0.3s; cursor: pointer; }
        .teacher-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .stat-card { transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="availableTeachers.title">Available Teachers</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="availableTeachers.title">Available Teachers</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Stats Start -->
    <div class="container-fluid py-4 bg-light">
        <div class="container">
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="stat-card bg-white rounded p-4 text-center shadow-sm">
                        <h2 class="text-primary mb-1" id="stat-total">0</h2>
                        <small class="text-muted" data-i18n="availableTeachers.total">Total Teachers</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card bg-white rounded p-4 text-center shadow-sm">
                        <h2 class="text-success mb-1" id="stat-active">0</h2>
                        <small class="text-muted" data-i18n="availableTeachers.active">Active</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card bg-white rounded p-4 text-center shadow-sm">
                        <h2 class="text-warning mb-1" id="stat-leave">0</h2>
                        <small class="text-muted" data-i18n="availableTeachers.onLeave">On Leave</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Stats End -->

    <!-- Teachers List Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <!-- Filters -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <input type="text" id="search-input" class="form-control rounded-pill px-4 py-2" data-i18n-placeholder="availableTeachers.search" placeholder="Search teachers...">
                </div>
                <div class="col-md-6">
                    <select id="subject-filter" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="availableTeachers.allSubjects">All Subjects</option>
                    </select>
                </div>
            </div>

            <!-- Teacher Grid -->
            <div id="teacher-list" class="row g-4">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>

            <!-- Empty State -->
            <div id="teacher-empty" class="text-center py-5" style="display:none">
                <i class="fa fa-user-slash fa-3x text-muted mb-3"></i>
                <h4 data-i18n="availableTeachers.noTeachers">No teachers found</h4>
            </div>
        </div>
    </div>
    <!-- Teachers List End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('available-teachers.html');
        IremeAuth.requireAuth();

        var allTeachers = [];

        function loadTeachers() {
            IremeAPI.getSchoolTeachers().then(function(data) {
                allTeachers = data.teachers || [];
                updateStats();
                loadSubjectFilter();
                displayTeachers(allTeachers);
            }).catch(function(err) {
                console.error('Failed to load teachers:', err);
                document.getElementById('teacher-list').innerHTML = '';
                document.getElementById('teacher-empty').style.display = 'block';
            });
        }

        function updateStats() {
            var total = allTeachers.length;
            var active = allTeachers.filter(function(t) { return t.status === 'ACTIVE' || !t.status; }).length;
            var onLeave = allTeachers.filter(function(t) { return t.status === 'ON_LEAVE'; }).length;
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-active').textContent = active;
            document.getElementById('stat-leave').textContent = onLeave;
        }

        function loadSubjectFilter() {
            var select = document.getElementById('subject-filter');
            var subjectSet = {};
            allTeachers.forEach(function(t) {
                if (t.subjects) {
                    t.subjects.forEach(function(s) {
                        subjectSet[s.name || s.nameEn || s] = true;
                    });
                }
            });
            Object.keys(subjectSet).sort().forEach(function(name) {
                var option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
        }

        function displayTeachers(teachers) {
            var container = document.getElementById('teacher-list');
            var emptyState = document.getElementById('teacher-empty');

            if (teachers.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            var html = teachers.map(function(t) {
                var subjects = (t.subjects || []).map(function(s) { return s.name || s.nameEn || s; }).join(', ') || 'N/A';
                var statusBadge = t.status === 'ON_LEAVE'
                    ? '<span class="badge bg-warning">On Leave</span>'
                    : '<span class="badge bg-success">Active</span>';

                return '<div class="col-md-6 col-lg-4 wow fadeInUp" data-wow-delay="0.1s">' +
                    '<div class="teacher-card bg-white rounded shadow-sm p-4 h-100">' +
                    '<div class="d-flex align-items-center mb-3">' +
                    '<div class="flex-shrink-0 bg-primary rounded-circle d-flex align-items-center justify-content-center text-white fw-bold" style="width:56px;height:56px;font-size:20px">' +
                    (t.firstName || 'T')[0] + (t.lastName || '')[0] +
                    '</div>' +
                    '<div class="flex-grow-1 ms-3">' +
                    '<h5 class="mb-0">' + (t.firstName || '') + ' ' + (t.lastName || '') + '</h5>' +
                    statusBadge +
                    '</div>' +
                    '</div>' +
                    '<p class="text-muted small mb-1"><i class="fa fa-book me-1"></i> ' + subjects + '</p>' +
                    (t.qualification ? '<p class="text-muted small mb-1"><i class="fa fa-graduation-cap me-1"></i> ' + t.qualification + '</p>' : '') +
                    (t.experience ? '<p class="text-muted small mb-0"><i class="fa fa-clock me-1"></i> ' + t.experience + ' years</p>' : '') +
                    '<div class="d-flex gap-2 mt-3">' +
                    '<a href="teacher-profile.html?id=' + t.id + '" class="btn btn-outline-primary btn-sm rounded-pill flex-grow-1">' +
                    '<i class="fa fa-eye me-1"></i> <span data-i18n="availableTeachers.viewProfile">View Profile</span></a>' +
                    '<a href="mailto:' + (t.email || '') + '" class="btn btn-primary btn-sm rounded-pill flex-grow-1">' +
                    '<i class="fa fa-envelope me-1"></i> <span data-i18n="availableTeachers.contact">Contact</span></a>' +
                    '</div>' +
                    '</div></div>';
            }).join('');

            container.innerHTML = html;
        }

        function filterTeachers() {
            var search = document.getElementById('search-input').value.toLowerCase();
            var subject = document.getElementById('subject-filter').value;

            var filtered = allTeachers.filter(function(t) {
                var name = ((t.firstName || '') + ' ' + (t.lastName || '')).toLowerCase();
                var matchesSearch = !search || name.indexOf(search) !== -1 || (t.email || '').toLowerCase().indexOf(search) !== -1;
                var matchesSubject = !subject || (t.subjects || []).some(function(s) {
                    return (s.name || s.nameEn || s).toLowerCase() === subject.toLowerCase();
                });
                return matchesSearch && matchesSubject;
            });

            displayTeachers(filtered);
        }

        document.getElementById('search-input').addEventListener('input', filterTeachers);
        document.getElementById('subject-filter').addEventListener('change', filterTeachers);

        loadTeachers();
    </script>
</body>
</html>
