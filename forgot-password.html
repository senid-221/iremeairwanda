<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Forgot Password</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-8 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-3 animated slideInRight" data-i18n="auth.forgotPassword">Forgot Password?</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item"><a class="text-white" href="login.html" data-i18n="auth.login">Log In</a></li>
                            <li class="breadcrumb-item text-white active" data-i18n="auth.forgotPassword">Forgot Password</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-5">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    <div class="wow fadeIn" data-wow-delay="0.1s">
                        <div class="bg-light rounded p-4 p-lg-5">
                            <div class="text-center mb-4">
                                <div class="service-icon btn-square rounded-circle mb-3 mx-auto"><i class="fa fa-lock fa-lg"></i></div>
                                <h4 class="mb-2" data-i18n="auth.resetPassword">Reset Password</h4>
                                <p class="text-muted small" data-i18n="auth.enterEmail">Enter your email address and we'll send you a link to reset your password.</p>
                            </div>

                            <div id="reset-alert" class="alert d-none" role="alert"></div>

                            <form id="reset-form">
                                <div class="mb-4">
                                    <label class="form-label" data-i18n="auth.email">Email Address</label>
                                    <input type="email" class="form-control" id="reset-email" required data-i18n="auth.email">
                                </div>
                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn btn-primary rounded-pill py-2" data-i18n="auth.sendResetLink">Send Reset Link</button>
                                </div>
                            </form>

                            <div class="text-center">
                                <a href="login.html" class="text-decoration-none" data-i18n="auth.backToLogin">Back to Login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
    <script>
        IremeComponents.initPage('forgot-password.html');

        document.getElementById('reset-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('reset-email').value.trim();
            var alertEl = document.getElementById('reset-alert');
            var result = IremeAuth.requestPasswordReset(email);
            alertEl.className = 'alert alert-' + (result.success ? 'success' : 'danger');
            alertEl.textContent = result.message || result.error;
            alertEl.classList.remove('d-none');
        });
    </script>
</body>
</html>
