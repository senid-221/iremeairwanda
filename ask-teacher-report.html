<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Request Teacher Report</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="askReport.title">Request Teacher Report</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="askReport.title">Request Report</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Form & Sidebar Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-8 wow fadeInUp" data-wow-delay="0.1s">
                    <div class="bg-light rounded p-4 p-lg-5">
                        <div class="text-center mb-4">
                            <div class="service-icon btn-square rounded-circle mb-3 mx-auto" style="background-color: var(--primary); color: #fff; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;">
                                <i class="fa fa-file-contract fa-lg"></i>
                            </div>
                            <h4 class="mb-1" data-i18n="askReport.title">Request Teacher Report</h4>
                            <p class="text-muted" data-i18n="askReport.desc">Request a report from a teacher about a student or class</p>
                        </div>

                        <form id="report-form">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-bold" data-i18n="askReport.selectTeacher">Select Teacher</label>
                                    <select id="teacher-select" class="form-select" required>
                                        <option value="">Loading teachers...</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" data-i18n="askReport.reportType">Report Type</label>
                                    <select id="report-type" class="form-select" required>
                                        <option value="CLASS_PROGRESS" data-i18n="askReport.classProgress">Class Progress Report</option>
                                        <option value="STUDENT_PERFORMANCE" data-i18n="askReport.studentPerformance">Student Performance</option>
                                        <option value="ATTENDANCE" data-i18n="askReport.attendance">Attendance Report</option>
                                        <option value="BEHAVIOR" data-i18n="askReport.behavior">Behavior Report</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" data-i18n="askReport.selectClass">Select Class</label>
                                    <input type="text" id="class-name" class="form-control" placeholder="e.g., S3 Math">
                                </div>
                                <div class="col-12" id="student-select-wrap" style="display:none">
                                    <label class="form-label fw-bold" data-i18n="askReport.selectStudent">Select Student (optional)</label>
                                    <input type="text" id="student-name" class="form-control" placeholder="Student name">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold" data-i18n="askReport.message">Request Message</label>
                                    <textarea id="message" class="form-control" rows="4" required></textarea>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary w-100 py-3">
                                        <i class="fa fa-paper-plane me-2"></i>
                                        <span data-i18n="askReport.submit">Send Request</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div id="form-error" class="alert alert-danger mt-3" style="display:none"></div>
                        <div id="form-success" class="alert alert-success mt-3" style="display:none"></div>
                    </div>
                </div>
                <div class="col-lg-4 wow fadeInUp" data-wow-delay="0.3s">
                    <div class="bg-light rounded p-4">
                        <h5 class="mb-3" data-i18n="askReport.recent">Recent Requests</h5>
                        <div id="recent-requests">
                            <p class="text-muted small" data-i18n="askReport.noRequests">No requests sent yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Form & Sidebar End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        IremeComponents.initPage('ask-teacher-report.html');
        IremeAuth.requireAuth();

        // Load teachers
        IremeAPI.getSchoolTeachers().then(function(data) {
            var select = document.getElementById('teacher-select');
            select.innerHTML = '<option value="">Select Teacher</option>';
            var teachers = data.teachers || [];
            teachers.forEach(function(t) {
                var option = document.createElement('option');
                option.value = t.id;
                option.textContent = (t.firstName || '') + ' ' + (t.lastName || '');
                select.appendChild(option);
            });
        }).catch(function(err) {
            console.error('Failed to load teachers:', err);
        });

        // Toggle student field based on report type
        document.getElementById('report-type').addEventListener('change', function() {
            var wrap = document.getElementById('student-select-wrap');
            wrap.style.display = this.value === 'STUDENT_PERFORMANCE' ? 'block' : 'none';
        });

        // Submit form
        document.getElementById('report-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var errorDiv = document.getElementById('form-error');
            var successDiv = document.getElementById('form-success');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            var data = {
                teacherId: document.getElementById('teacher-select').value,
                reportType: document.getElementById('report-type').value,
                className: document.getElementById('class-name').value || null,
                studentName: document.getElementById('student-name').value || null,
                message: document.getElementById('message').value
            };

            IremeAPI.requestTeacherReport(data).then(function(result) {
                successDiv.textContent = IremeI18n.t('askReport.success');
                successDiv.style.display = 'block';
                document.getElementById('report-form').reset();
                window.scrollTo(0, 0);
                loadRecentRequests();
            }).catch(function(err) {
                errorDiv.textContent = err.message || 'Failed to send request';
                errorDiv.style.display = 'block';
                window.scrollTo(0, 0);
            });
        });

        function loadRecentRequests() {
            IremeAPI.getTeacherReports().then(function(data) {
                var container = document.getElementById('recent-requests');
                var reports = data.reports || [];
                if (reports.length === 0) {
                    container.innerHTML = '<p class="text-muted small">' + IremeI18n.t('askReport.noRequests') + '</p>';
                    return;
                }
                var html = reports.slice(0, 5).map(function(r) {
                    return '<div class="border-bottom py-2">' +
                        '<div class="fw-bold small">' + (r.reportType || 'Report') + '</div>' +
                        '<small class="text-muted">' + new Date(r.createdAt).toLocaleDateString() + '</small>' +
                        '</div>';
                }).join('');
                container.innerHTML = html;
            }).catch(function(err) {
                console.error('Failed to load reports:', err);
            });
        }

        loadRecentRequests();
    </script>
</body>
</html>
