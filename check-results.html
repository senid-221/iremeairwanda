<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>IREME - Check Results</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="IREME Results, Student Results, Rwanda, Academic Performance, Grades" name="keywords">
    <meta content="View your examination results and academic performance. Track your progress across subjects and assessments." name="description">

    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        .result-row { transition: all 0.2s; }
        .result-row:hover { background-color: #f8f9fa; }
        .grade-badge { min-width: 40px; text-align: center; }
        .stat-card { transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
    </style>
</head>

<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="results.title">Check Results</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="results.title">Results</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Performance Summary Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <h2 class="mb-4" data-i18n="results.performance">Performance Summary</h2>
            <div class="row g-4 mb-5" id="stats-row">
                <div class="col-md-3 col-sm-6 wow fadeInUp" data-wow-delay="0.1s">
                    <div class="stat-card bg-white rounded shadow-sm p-4 text-center h-100">
                        <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                            <i class="fa fa-clipboard-list text-white fa-lg"></i>
                        </div>
                        <h3 id="stat-total" class="mb-1">0</h3>
                        <p class="text-muted mb-0" data-i18n="results.totalAttempts">Total Attempts</p>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6 wow fadeInUp" data-wow-delay="0.2s">
                    <div class="stat-card bg-white rounded shadow-sm p-4 text-center h-100">
                        <div class="bg-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                            <i class="fa fa-percentage text-white fa-lg"></i>
                        </div>
                        <h3 id="stat-average">0%</h3>
                        <p class="text-muted mb-0" data-i18n="results.averageScore">Average Score</p>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6 wow fadeInUp" data-wow-delay="0.3s">
                    <div class="stat-card bg-white rounded shadow-sm p-4 text-center h-100">
                        <div class="bg-warning rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                            <i class="fa fa-star text-white fa-lg"></i>
                        </div>
                        <h3 id="stat-best" class="text-truncate">-</h3>
                        <p class="text-muted mb-0" data-i18n="results.bestSubject">Best Subject</p>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6 wow fadeInUp" data-wow-delay="0.4s">
                    <div class="stat-card bg-white rounded shadow-sm p-4 text-center h-100">
                        <div class="bg-info rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                            <i class="fa fa-chart-line text-white fa-lg"></i>
                        </div>
                        <h3 id="stat-improved" class="text-truncate">-</h3>
                        <p class="text-muted mb-0" data-i18n="results.improvement">Most Improved</p>
                    </div>
                </div>
            </div>

            <!-- Results Table -->
            <h2 class="mb-4" data-i18n="results.recentResults">Recent Results</h2>
            <div class="bg-white rounded shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th data-i18n="results.date">Date</th>
                                <th data-i18n="results.type">Type</th>
                                <th data-i18n="results.subject">Subject</th>
                                <th data-i18n="results.score">Score</th>
                                <th data-i18n="results.percentage">Percentage</th>
                                <th data-i18n="results.grade">Grade</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="results-tbody">
                            <!-- Results loaded here -->
                        </tbody>
                    </table>
                </div>

                <div id="results-empty" class="text-center py-5" style="display: none;">
                    <i class="fa fa-chart-bar fa-3x text-muted mb-3"></i>
                    <h4 data-i18n="results.noResults">No results available yet</h4>
                    <p class="text-muted" data-i18n="results.noResultsDesc">Your exam and quiz results will appear here</p>
                    <a href="quizzes.html" class="btn btn-primary rounded-pill px-4 mt-2">
                        <i class="fa fa-question-circle me-1"></i> Take a Quiz
                    </a>
                </div>
            </div>
        </div>
    </div>
    <!-- Performance Summary End -->

    <div id="component-footer"></div>

    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('check-results.html');
        IremeAuth.requireAuth();

        function getGrade(percentage) {
            if (percentage >= 90) return { grade: 'A', color: 'bg-success' };
            if (percentage >= 80) return { grade: 'B', color: 'bg-primary' };
            if (percentage >= 70) return { grade: 'C', color: 'bg-info' };
            if (percentage >= 60) return { grade: 'D', color: 'bg-warning' };
            return { grade: 'F', color: 'bg-danger' };
        }

        function loadResults() {
            IremeAPI.getStudentResults().then(function(data) {
                var results = data.results || data.attempts || [];
                displayResults(results);
                computeStats(results);
            }).catch(function(err) {
                console.error('Failed to load results:', err);
                displayResults([]);
                computeStats([]);
            });
        }

        function computeStats(results) {
            var total = results.length;
            document.getElementById('stat-total').textContent = total;

            if (total === 0) return;

            var sum = 0;
            var subjectScores = {};

            results.forEach(function(r) {
                var pct = r.percentage || (r.total > 0 ? Math.round((r.score / r.total) * 100) : 0);
                sum += pct;

                var subj = r.subjectName || r.subject || 'General';
                if (!subjectScores[subj]) subjectScores[subj] = [];
                subjectScores[subj].push(pct);
            });

            var avg = Math.round(sum / total);
            document.getElementById('stat-average').textContent = avg + '%';

            var bestSubject = '-';
            var bestAvg = 0;
            var mostImproved = '-';
            var bestImprovement = 0;

            Object.keys(subjectScores).forEach(function(subj) {
                var scores = subjectScores[subj];
                var subjectAvg = scores.reduce(function(a, b) { return a + b; }, 0) / scores.length;
                if (subjectAvg > bestAvg) {
                    bestAvg = subjectAvg;
                    bestSubject = subj;
                }
                if (scores.length >= 2) {
                    var improvement = scores[scores.length - 1] - scores[0];
                    if (improvement > bestImprovement) {
                        bestImprovement = improvement;
                        mostImproved = subj;
                    }
                }
            });

            document.getElementById('stat-best').textContent = bestSubject;
            document.getElementById('stat-improved').textContent = mostImproved;
        }

        function displayResults(results) {
            var tbody = document.getElementById('results-tbody');
            var emptyState = document.getElementById('results-empty');

            if (results.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            var html = results.map(function(r) {
                var pct = r.percentage || (r.total > 0 ? Math.round((r.score / r.total) * 100) : 0);
                var gradeInfo = getGrade(pct);
                var date = r.createdAt ? new Date(r.createdAt).toLocaleDateString() : '-';
                var type = r.type || r.assessmentType || 'Quiz';
                var subject = r.subjectName || r.subject || 'General';

                return '<tr class="result-row">' +
                    '<td>' + date + '</td>' +
                    '<td><span class="badge bg-light text-dark">' + type + '</span></td>' +
                    '<td>' + subject + '</td>' +
                    '<td>' + (r.score || 0) + '/' + (r.total || 0) + '</td>' +
                    '<td>' + pct + '%</td>' +
                    '<td><span class="badge ' + gradeInfo.color + ' grade-badge">' + gradeInfo.grade + '</span></td>' +
                    '<td><button class="btn btn-sm btn-outline-primary rounded-pill" onclick="viewDetails(\'' + (r.id || '') + '\')"><i class="fa fa-eye"></i></button></td>' +
                    '</tr>';
            }).join('');

            tbody.innerHTML = html;
        }

        function viewDetails(resultId) {
            if (!resultId) return;
            IremeAPI.getAssessment(resultId).then(function(data) {
                alert('Assessment: ' + (data.title || data.name || 'Details') + '\nScore: ' + (data.score || '-') + '\nTotal: ' + (data.total || '-'));
            }).catch(function() {
                alert('Details not available for this result');
            });
        }

        loadResults();
    </script>
</body>

</html>
