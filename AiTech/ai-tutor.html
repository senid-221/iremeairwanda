<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - AI Chat</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f7f7f8;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .chat-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #fff;
            border-bottom: 1px solid #e5e5e7;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-header-left i {
            font-size: 1.5rem;
            color: #1363C6;
        }

        .chat-header-left h5 {
            margin: 0;
            font-weight: 600;
            font-size: 1.1rem;
            color: #1a1a1a;
        }

        .chat-subject-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            background: #e3f2fd;
            color: #1363C6;
            font-weight: 500;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background-color: #fff;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #d1d1d6;
            border-radius: 3px;
        }

        .chat-message {
            margin-bottom: 1.5rem;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.user {
            justify-content: flex-end;
        }

        .chat-message.ai {
            justify-content: flex-start;
        }

        .chat-message .message-bubble {
            max-width: 70%;
            padding: 0.875rem 1.125rem;
            border-radius: 18px;
            position: relative;
            line-height: 1.5;
        }

        .chat-message.user .message-bubble {
            background: linear-gradient(135deg, #1363C6 0%, #0d4a94 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .chat-message.ai .message-bubble {
            background-color: #f0f0f5;
            color: #1a1a1a;
            border-bottom-left-radius: 4px;
        }

        .chat-message .message-sender {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            opacity: 0.7;
        }

        .chat-message.user .message-sender {
            text-align: right;
        }

        .chat-message .message-text {
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .chat-message .message-text p {
            margin-bottom: 0.5rem;
        }

        .chat-message .message-text p:last-child {
            margin-bottom: 0;
        }

        .chat-input-area {
            background-color: #fff;
            border-top: 1px solid #e5e5e7;
            padding: 1.25rem 1.5rem;
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .chat-action-btn {
            background: #f0f0f5;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #666;
            flex-shrink: 0;
            position: relative;
        }

        .chat-action-btn:hover {
            background: #e0e0e5;
            color: #1363C6;
        }

        .chat-action-btn.recording {
            background: #ff3b30;
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .chat-input-field {
            flex: 1;
            border: 1px solid #d1d1d6;
            border-radius: 24px;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            resize: none;
            max-height: 150px;
            font-family: inherit;
        }

        .chat-input-field:focus {
            outline: none;
            border-color: #1363C6;
        }

        .attachment-preview {
            max-width: 900px;
            margin: 0 auto 0.75rem;
            display: none;
        }

        .attachment-preview.active {
            display: block;
        }

        .attachment-item {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #f0f0f5;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .attachment-item i {
            color: #1363C6;
        }

        .attachment-remove {
            cursor: pointer;
            color: #999;
            margin-left: 0.25rem;
        }

        .attachment-remove:hover {
            color: #ff3b30;
        }

        .chat-send-btn {
            background: linear-gradient(135deg, #1363C6 0%, #0d4a94 100%);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            color: #fff;
            flex-shrink: 0;
        }

        .chat-send-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .chat-send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .typing-dots span {
            animation: typingBlink 1.4s infinite;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBlink {
            0%, 20% { opacity: 0.2; }
            50% { opacity: 1; }
            80%, 100% { opacity: 0.2; }
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #8e8e93;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state h5 {
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .empty-state p {
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        .subject-selector {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .subject-btn {
            padding: 0.375rem 0.875rem;
            border-radius: 20px;
            border: 1px solid #d1d1d6;
            background-color: #fff;
            color: #1a1a1a;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .subject-btn:hover,
        .subject-btn.active {
            background: linear-gradient(135deg, #1363C6 0%, #0d4a94 100%);
            color: #fff;
            border-color: #1363C6;
        }

        @media (max-width: 768px) {
            .chat-container {
                padding: 1rem;
            }

            .chat-message .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>
    <div class="chat-page">
        <div class="chat-header">
            <div class="chat-header-left">
                <i class="fa fa-robot"></i>
                <h5>Ireme AI</h5>
            </div>
            <span class="chat-subject-badge" id="chat-subject-badge">General</span>
        </div>

        <div class="chat-container" id="chat-container">
            <div id="chat-welcome" class="empty-state">
                <i class="fa fa-robot"></i>
                <h5>How can I help you today?</h5>
                <p>Ask me anything about your studies</p>
                <div class="subject-selector">
                    <button class="subject-btn active" data-subject="general">General</button>
                    <button class="subject-btn" data-subject="math">Math</button>
                    <button class="subject-btn" data-subject="science">Science</button>
                    <button class="subject-btn" data-subject="english">English</button>
                    <button class="subject-btn" data-subject="kinyarwanda">Kinyarwanda</button>
                </div>
            </div>

            <div id="chat-messages"></div>

            <div id="typing-indicator" class="chat-message ai" style="display:none;">
                <div class="message-bubble">
                    <div class="message-sender"><i class="fa fa-robot me-1"></i> Ireme AI</div>
                    <div class="message-text">
                        <span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="attachment-preview" id="attachment-preview"></div>
            <div class="chat-input-wrapper">
                <button class="chat-action-btn" id="chat-attach-btn" title="Attach file">
                    <i class="fa fa-paperclip"></i>
                </button>
                <input type="file" id="chat-file-input" style="display:none;" multiple accept="image/*,.pdf,.doc,.docx,.txt">
                <button class="chat-action-btn" id="chat-voice-btn" title="Voice input">
                    <i class="fa fa-microphone"></i>
                </button>
                <textarea 
                    class="chat-input-field" 
                    id="chat-input" 
                    placeholder="Message Ireme AI..." 
                    rows="1"
                    aria-label="Chat input"
                ></textarea>
                <button class="chat-send-btn" id="chat-send-btn" disabled>
                    <i class="fa fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (!IremeAuth.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        var currentSubject = 'general';
        var conversationId = null;
        var attachedFiles = [];
        var isRecording = false;
        var recognition = null;

        var chatContainer = document.getElementById('chat-container');
        var chatInput = document.getElementById('chat-input');
        var chatSendBtn = document.getElementById('chat-send-btn');
        var chatWelcome = document.getElementById('chat-welcome');
        var chatMessagesEl = document.getElementById('chat-messages');
        var typingIndicator = document.getElementById('typing-indicator');
        var subjectBadge = document.getElementById('chat-subject-badge');
        var attachBtn = document.getElementById('chat-attach-btn');
        var fileInput = document.getElementById('chat-file-input');
        var attachmentPreview = document.getElementById('attachment-preview');
        var voiceBtn = document.getElementById('chat-voice-btn');

        // Initialize speech recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = function(event) {
                var transcript = '';
                for (var i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                chatInput.value = transcript;
                chatSendBtn.disabled = !transcript.trim();
            };

            recognition.onend = function() {
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.querySelector('i').className = 'fa fa-microphone';
            };

            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.querySelector('i').className = 'fa fa-microphone';
            };
        } else {
            voiceBtn.style.display = 'none';
        }

        chatInput.addEventListener('input', function() {
            updateSendButton();
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (this.value.trim()) {
                    sendMessage();
                }
            }
        });

        chatSendBtn.addEventListener('click', function() {
            if (chatInput.value.trim()) {
                sendMessage();
            }
        });

        document.querySelectorAll('.subject-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.subject-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');
                currentSubject = this.dataset.subject;
                subjectBadge.textContent = this.textContent;
            });
        });

        // Attachment button
        attachBtn.addEventListener('click', function() {
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            var files = Array.from(e.target.files);
            files.forEach(function(file) {
                if (file.size > 10 * 1024 * 1024) {
                    alert('File size must be less than 10MB');
                    return;
                }
                attachedFiles.push(file);
                addAttachmentPreview(file);
            });
            fileInput.value = '';
            updateSendButton();
        });

        // Voice button
        voiceBtn.addEventListener('click', function() {
            if (!recognition) {
                alert('Speech recognition is not supported in your browser');
                return;
            }

            if (isRecording) {
                recognition.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.querySelector('i').className = 'fa fa-microphone';
            } else {
                recognition.start();
                isRecording = true;
                voiceBtn.classList.add('recording');
                voiceBtn.querySelector('i').className = 'fa fa-stop';
            }
        });

        function addAttachmentPreview(file) {
            attachmentPreview.classList.add('active');
            var item = document.createElement('div');
            item.className = 'attachment-item';
            item.dataset.filename = file.name;
            
            var icon = file.type.startsWith('image/') ? 'fa-image' : 'fa-file';
            item.innerHTML = '<i class="fa ' + icon + '"></i>' +
                '<span>' + file.name + '</span>' +
                '<span class="attachment-remove" onclick="removeAttachment(\'' + file.name + '\')"><i class="fa fa-times"></i></span>';
            
            attachmentPreview.appendChild(item);
        }

        function removeAttachment(filename) {
            attachedFiles = attachedFiles.filter(function(f) { return f.name !== filename; });
            var item = attachmentPreview.querySelector('[data-filename="' + filename + '"]');
            if (item) item.remove();
            
            if (attachedFiles.length === 0) {
                attachmentPreview.classList.remove('active');
            }
            updateSendButton();
        }

        function updateSendButton() {
            chatSendBtn.disabled = !chatInput.value.trim() && attachedFiles.length === 0;
        }

        function sendMessage() {
            var message = chatInput.value.trim();
            if (!message && attachedFiles.length === 0) return;

            if (chatWelcome) {
                chatWelcome.style.display = 'none';
            }

            var displayMessage = message;
            if (attachedFiles.length > 0) {
                var fileNames = attachedFiles.map(function(f) { return f.name; }).join(', ');
                displayMessage = message ? message + '\n\n📎 Attached: ' + fileNames : '📎 Attached: ' + fileNames;
            }

            addMessage('user', displayMessage);
            chatInput.value = '';
            chatInput.style.height = 'auto';
            
            // Clear attachments
            attachedFiles = [];
            attachmentPreview.innerHTML = '';
            attachmentPreview.classList.remove('active');
            
            updateSendButton();

            typingIndicator.style.display = 'flex';
            scrollToBottom();

            IremeAPI.post('/api/ai/chat', {
                message: message,
                subject: currentSubject,
                conversationId: conversationId
            }).then(function(res) {
                typingIndicator.style.display = 'none';
                
                if (res.conversationId) {
                    conversationId = res.conversationId;
                }

                if (res.reply) {
                    addMessage('ai', res.reply);
                } else {
                    addMessage('ai', 'Sorry, I encountered an error. Please try again.');
                }

                scrollToBottom();
            }).catch(function(err) {
                typingIndicator.style.display = 'none';
                console.error('Chat error:', err);
                addMessage('ai', 'Sorry, I encountered an error. Please try again.');
                scrollToBottom();
            });
        }

        function addMessage(sender, text) {
            var messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message ' + sender;

            var bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            var senderLabel = document.createElement('div');
            senderLabel.className = 'message-sender';
            senderLabel.textContent = sender === 'user' ? 'You' : 'Ireme AI';

            var textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.innerHTML = formatMessage(text);

            bubble.appendChild(senderLabel);
            bubble.appendChild(textDiv);
            messageDiv.appendChild(bubble);

            chatMessagesEl.appendChild(messageDiv);
        }

        function formatMessage(text) {
            text = text.replace(/\n/g, '<br>');
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
            return text;
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
