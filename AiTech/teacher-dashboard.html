<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Teacher Dashboard</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="dashboard.welcome">Welcome back</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active">Teacher Dashboard</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-5">
        <div class="container">
            <div class="row g-4 mb-5">
                <div class="col-md-3 wow fadeIn" data-wow-delay="0.1s">
                    <div class="service-item rounded text-center p-4">
                        <i class="fa fa-users fa-2x text-primary mb-3"></i>
                        <h3 class="fw-bold" id="dash-teacher-students">0</h3>
                        <p class="mb-0" data-i18n="dashboard.myStudents">My Students</p>
                    </div>
                </div>
                <div class="col-md-3 wow fadeIn" data-wow-delay="0.2s">
                    <div class="service-item rounded text-center p-4">
                        <i class="fa fa-book fa-2x text-primary mb-3"></i>
                        <h3 class="fw-bold" id="dash-teacher-classes">0</h3>
                        <p class="mb-0" data-i18n="dashboard.lessons">Classes</p>
                    </div>
                </div>
                <div class="col-md-3 wow fadeIn" data-wow-delay="0.3s">
                    <div class="service-item rounded text-center p-4">
                        <i class="fa fa-clipboard-check fa-2x text-primary mb-3"></i>
                        <h3 class="fw-bold" id="dash-teacher-assignments">0</h3>
                        <p class="mb-0" data-i18n="dashboard.assessments">Assignments</p>
                    </div>
                </div>
                <div class="col-md-3 wow fadeIn" data-wow-delay="0.4s">
                    <div class="service-item rounded text-center p-4">
                        <i class="fa fa-school fa-2x text-primary mb-3"></i>
                        <h3 class="fw-bold" id="dash-teacher-school-name" style="font-size:0.9rem">—</h3>
                        <p class="mb-0" data-i18n="dashboard.school">School</p>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-8 wow fadeIn" data-wow-delay="0.1s">
                    <div class="bg-light rounded p-4">
                        <h4 class="mb-4" data-i18n="dashboard.myClasses">My Classes</h4>
                        <div class="row g-3" id="dash-teacher-classes-list">
                            <div class="col-12 text-center text-muted py-3">Loading classes...</div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4 wow fadeIn" data-wow-delay="0.3s">
                    <div class="bg-light rounded p-4">
                        <h4 class="mb-4">Quick Actions</h4>
                        <div class="d-grid gap-3">
                            <button class="btn btn-primary rounded-pill py-3" data-i18n="dashboard.createLesson">Create Lesson</button>
                            <button class="btn btn-outline-primary rounded-pill py-3" data-i18n="dashboard.createQuiz">Create Quiz</button>
                            <button class="btn btn-outline-primary rounded-pill py-3" data-i18n="dashboard.viewReports">View Reports</button>
                            <a href="ai-tutor.html" class="btn btn-outline-primary rounded-pill py-3" data-i18n="dashboard.aiAssistant">Ask Ireme AI</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12 wow fadeIn" data-wow-delay="0.1s">
                    <div class="bg-light rounded p-4">
                        <h4 class="mb-4" data-i18n="dashboard.recentActivity">Recent Activity</h4>
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr><th>Activity</th><th>Class</th><th>Status</th><th>Date</th></tr>
                                </thead>
                                <tbody id="dash-teacher-activity">
                                    <tr><td colspan="4" class="text-center text-muted py-3">Loading activity...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        IremeComponents.initPage('teacher-dashboard.html');
        if (!IremeAuth.requireRole('teacher')) { throw new Error('Access denied'); }
        var user = IremeAuth.currentUser();
        if (user) {
            var welcomeEl = document.querySelector('[data-i18n="dashboard.welcome"]');
            if (welcomeEl) welcomeEl.textContent = user.name;
        }

        IremeAPI.getDashboard('teacher').then(function(data) {
            var classes = data.classes || [];
            var assignments = data.assignments || [];
            var students = data.students || [];
            var school = data.school;
            var recentActivity = data.recentActivity || [];

            document.getElementById('dash-teacher-students').textContent = students.length;
            document.getElementById('dash-teacher-classes').textContent = classes.length;
            document.getElementById('dash-teacher-assignments').textContent = assignments.length;
            if (school) {
                document.getElementById('dash-teacher-school-name').textContent = school.nameEn || school.name || '—';
            }

            var classesList = document.getElementById('dash-teacher-classes-list');
            if (classes.length === 0) {
                classesList.innerHTML = '<div class="col-12 text-center text-muted py-3">No classes assigned yet.</div>';
            } else {
                classesList.innerHTML = classes.map(function(c) {
                    var classAssignments = assignments.filter(function(a) { return a.class && a.class.id === c.id; });
                    var subjectNames = classAssignments.map(function(a) { return a.subject ? (a.subject.nameEn || a.subject.name) : ''; }).filter(Boolean).join(', ');
                    var studentCount = students.filter(function(s) { return s.class && s.class.id === c.id; }).length;
                    return '<div class="col-md-6"><div class="service-item rounded p-3">' +
                        '<h6 class="mb-1">' + (c.name || c.level || 'Class').replace(/</g, '&lt;') + (subjectNames ? ' - ' + subjectNames.replace(/</g, '&lt;') : '') + '</h6>' +
                        '<small class="text-muted">' + studentCount + ' students</small>' +
                        '</div></div>';
                }).join('');
            }

            var activityTbody = document.getElementById('dash-teacher-activity');
            if (recentActivity.length === 0) {
                activityTbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No recent activity</td></tr>';
            } else {
                activityTbody.innerHTML = recentActivity.map(function(a) {
                    var date = new Date(a.createdAt).toLocaleDateString();
                    return '<tr><td>' + (a.activityTitle || a.activityType || '').replace(/</g, '&lt;') + '</td><td>—</td><td><span class="badge bg-success">Logged</span></td><td>' + date + '</td></tr>';
                }).join('');
            }
        }).catch(function() {
            document.getElementById('dash-teacher-classes-list').innerHTML = '<div class="col-12 text-center text-muted py-3">Could not load dashboard data</div>';
        });
    </script>
</body>
</html>
