<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Register</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-8 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-3 animated slideInRight" data-i18n="auth.register">Register</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" data-i18n="auth.register">Register</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-5">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="wow fadeIn" data-wow-delay="0.1s">
                        <div class="bg-light rounded p-4 p-lg-5">
                            <h4 class="mb-4 text-center" data-i18n="auth.selectRole">Select Your Role</h4>

                            <div id="role-selection">
                                <div class="row g-3 mb-4" id="role-grid"></div>
                            </div>

                            <div id="register-form-container" class="d-none">
                                <div class="text-center mb-3">
                                    <span class="badge bg-primary rounded-pill px-3 py-2" id="selected-role-badge"></span>
                                    <button class="btn btn-sm btn-link" onclick="showRoleSelection()" data-i18n="auth.selectRole">Change</button>
                                </div>

                                <div id="register-alert" class="alert d-none" role="alert"></div>

                                <div id="verification-notice" class="alert alert-warning d-none" role="alert">
                                    <i class="fa fa-info-circle me-2"></i>
                                    <span data-i18n="auth.verificationRequired">Teacher accounts require approval by an administrator before access is granted.</span>
                                </div>

                                <form id="register-form">
                                    <input type="hidden" id="register-role">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="auth.fullName">Full Name</label>
                                        <input type="text" class="form-control" id="register-name" required data-i18n="auth.fullName">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="auth.email">Email Address</label>
                                        <input type="email" class="form-control" id="register-email" required data-i18n="auth.email">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="auth.password">Password</label>
                                        <input type="password" class="form-control" id="register-password" required minlength="8" data-i18n="auth.password">
                                        <small class="text-muted" data-i18n="auth.passwordMinLength">Password must be at least 8 characters</small>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label" data-i18n="auth.confirmPassword">Confirm Password</label>
                                        <input type="password" class="form-control" id="register-confirm-password" required data-i18n="auth.confirmPassword">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Your Location (optional)</label>
                                        <div id="register-location-selector"></div>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary rounded-pill py-2" data-i18n="auth.register">Register</button>
                                    </div>
                                </form>
                            </div>

                            <hr class="my-4">
                            <p class="text-center text-muted small mb-0">
                                <span data-i18n="auth.hasAccount">Already have an account?</span>
                                <a href="login.html" class="text-decoration-none" data-i18n="auth.signInHere">Sign in here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/components.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/rwanda-admin.js"></script>
    <script src="js/location-selector.js"></script>
    <script>
        IremeComponents.initPage('register.html');

        if (IremeAuth.isLoggedIn()) { IremeAuth.redirectToDashboard(); }

        // Initialize location selector
        IremeLocation.init('register-location-selector', { required: false });

        var registerableRoles = ['student', 'teacher', 'parent', 'headteacher'];
        var roleIcons = { student: 'fa-user-graduate', teacher: 'fa-chalkboard-teacher', parent: 'fa-users', headteacher: 'fa-school' };
        var roleI18n = { student: 'auth.role.student', teacher: 'auth.role.teacher', parent: 'auth.role.parent', headteacher: 'auth.headteacherPortal' };
        var roleColors = { student: '', teacher: '', parent: '', headteacher: '' };

        function renderRoleGrid() {
            var grid = document.getElementById('role-grid');
            if (!grid) return;
            var html = '';
            registerableRoles.forEach(function(role) {
                var btnClass = roleColors[role] || 'btn-outline-primary';
                html += '<div class="col-6 col-md-3">' +
                    '<button class="btn ' + btnClass + ' w-100 py-2" onclick="selectRole(\'' + role + '\')">' +
                    '<i class="fa ' + roleIcons[role] + ' d-block mb-1 fa-lg"></i>' +
                    '<small data-i18n="' + roleI18n[role] + '">' + (IremeAuth.ROLES[role] ? IremeAuth.ROLES[role].label : 'Headteacher') + '</small>' +
                    '</button></div>';
            });
            grid.innerHTML = html;
        }

        function selectRole(role) {
            if (role === 'headteacher') {
                window.location.href = 'headteacher-register.html';
                return;
            }

            document.getElementById('register-role').value = role;
            document.getElementById('selected-role-badge').textContent = IremeAuth.ROLES[role].label;
            document.getElementById('role-selection').classList.add('d-none');
            document.getElementById('register-form-container').classList.remove('d-none');

            var needsVerification = (role === 'teacher');
            document.getElementById('verification-notice').classList.toggle('d-none', !needsVerification);
        }

        function showRoleSelection() {
            document.getElementById('role-selection').classList.remove('d-none');
            document.getElementById('register-form-container').classList.add('d-none');
        }

        renderRoleGrid();

        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var alertEl = document.getElementById('register-alert');
            var password = document.getElementById('register-password').value;
            var confirmPassword = document.getElementById('register-confirm-password').value;
            var submitBtn = this.querySelector('button[type="submit"]');

            if (password !== confirmPassword) {
                alertEl.className = 'alert alert-danger';
                alertEl.textContent = 'Passwords do not match';
                alertEl.classList.remove('d-none');
                return;
            }

            var data = {
                fullName: document.getElementById('register-name').value.trim(),
                email: document.getElementById('register-email').value.trim(),
                password: password,
                role: document.getElementById('register-role').value
            };

            // Include location data if available
            var locSel = IremeLocation.getSelection('register-location-selector');
            if (locSel.province) {
                data.province = locSel.province;
                data.district = locSel.district;
                data.sector = locSel.sector;
                data.cell = locSel.cell;
                data.village = locSel.village;
            }

            function setLoading(loading) {
                if (submitBtn) {
                    submitBtn.disabled = loading;
                    if (loading) {
                        submitBtn.dataset.originalHtml = submitBtn.innerHTML;
                        submitBtn.textContent = 'Creating account...';
                    } else if (submitBtn.dataset.originalHtml) {
                        submitBtn.innerHTML = submitBtn.dataset.originalHtml;
                    }
                }
            }

            alertEl.classList.add('d-none');
            setLoading(true);

            IremeAuth.register(data).then(function(result) {
                if (result.success) {
                    if (result.user && result.user.status === 'PENDING') {
                        window.location.href = 'account-pending.html';
                    } else if (IremeAuth.isLoggedIn()) {
                        window.location.href = IremeAuth.getDashboardUrl(result.user ? result.user.role : data.role);
                    } else {
                        // Account created but not auto-signed-in: send to login.
                        var loginPages = { student: 'student-login.html', teacher: 'account-pending.html', parent: 'parent-login.html' };
                        window.location.href = loginPages[data.role] || 'login.html';
                    }
                } else {
                    setLoading(false);
                    alertEl.className = 'alert alert-danger';
                    alertEl.textContent = result.error;
                    alertEl.classList.remove('d-none');
                }
            });
        });
    </script>
</body>
</html>
