<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Register Teacher</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="registerTeacher.title">Register Teacher</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="registerTeacher.title">Register Teacher</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Registration Form Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4 justify-content-center">
                <div class="col-lg-8 wow fadeInUp" data-wow-delay="0.1s">
                    <div class="bg-light rounded p-4 p-lg-5">
                        <div class="text-center mb-4">
                            <div class="service-icon btn-square rounded-circle mb-3 mx-auto" style="background-color: var(--primary); color: #fff; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;">
                                <i class="fa fa-user-plus fa-lg"></i>
                            </div>
                            <h4 class="mb-1" data-i18n="registerTeacher.title">Register Teacher</h4>
                            <p class="text-muted" data-i18n="registerTeacher.desc">Add a new teacher to your school</p>
                        </div>

                        <form id="teacher-form">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" data-i18n="registerTeacher.firstName">First Name</label>
                                    <input type="text" id="first-name" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" data-i18n="registerTeacher.lastName">Last Name</label>
                                    <input type="text" id="last-name" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" data-i18n="registerTeacher.email">Email Address</label>
                                    <input type="email" id="email" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" data-i18n="registerTeacher.phone">Phone Number</label>
                                    <input type="tel" id="phone" class="form-control" placeholder="+250">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold" data-i18n="registerTeacher.subjects">Subjects</label>
                                    <select id="subjects" class="form-select" multiple required>
                                        <option value="">Loading subjects...</option>
                                    </select>
                                    <small class="text-muted">Hold Ctrl/Cmd to select multiple subjects</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" data-i18n="registerTeacher.qualification">Qualification</label>
                                    <select id="qualification" class="form-select" required>
                                        <option value="" data-i18n="registerTeacher.selectQualification">Select Qualification</option>
                                        <option value="DIPLOMA" data-i18n="registerTeacher.diploma">Diploma</option>
                                        <option value="BACHELOR" data-i18n="registerTeacher.bachelor">Bachelor's Degree</option>
                                        <option value="MASTERS" data-i18n="registerTeacher.masters">Master's Degree</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" data-i18n="registerTeacher.experience">Years of Experience</label>
                                    <input type="number" id="experience" class="form-control" min="0" max="50">
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary w-100 py-3">
                                        <i class="fa fa-check me-2"></i>
                                        <span data-i18n="registerTeacher.submit">Register Teacher</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div id="form-error" class="alert alert-danger mt-3" style="display:none"></div>
                        <div id="form-success" class="alert alert-success mt-3" style="display:none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Registration Form End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        IremeComponents.initPage('register-teacher.html');
        IremeAuth.requireAuth();

        // Load subjects
        IremeAPI.getCurriculumSubjects().then(function(data) {
            var select = document.getElementById('subjects');
            select.innerHTML = '';
            var subjects = data.subjects || [];
            subjects.forEach(function(subject) {
                var option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.name || subject.nameEn;
                select.appendChild(option);
            });
        }).catch(function(err) {
            console.error('Failed to load subjects:', err);
        });

        document.getElementById('teacher-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var errorDiv = document.getElementById('form-error');
            var successDiv = document.getElementById('form-success');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            var selectedSubjects = Array.from(document.getElementById('subjects').selectedOptions).map(function(opt) {
                return opt.value;
            });

            var data = {
                firstName: document.getElementById('first-name').value,
                lastName: document.getElementById('last-name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value || null,
                subjectIds: selectedSubjects,
                qualification: document.getElementById('qualification').value,
                experience: parseInt(document.getElementById('experience').value) || 0
            };

            IremeAPI.registerTeacherAtSchool(null, data).then(function(result) {
                successDiv.textContent = IremeI18n.t('registerTeacher.success');
                successDiv.style.display = 'block';
                document.getElementById('teacher-form').reset();
                window.scrollTo(0, 0);
            }).catch(function(err) {
                errorDiv.textContent = err.message || 'Failed to register teacher';
                errorDiv.style.display = 'block';
                window.scrollTo(0, 0);
            });
        });
    </script>
</body>
</html>
