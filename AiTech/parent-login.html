<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Parent Login</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-8 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-3 animated slideInRight" data-i18n="auth.parentPortal">Parent Portal</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item"><a class="text-white" href="login.html" data-i18n="auth.login">Log In</a></li>
                            <li class="breadcrumb-item text-white active" data-i18n="auth.role.parent">Parent</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-5">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    <div class="wow fadeIn" data-wow-delay="0.1s">
                        <div class="bg-light rounded p-4 p-lg-5">
                            <div class="text-center mb-4">
                                <div class="service-icon btn-square rounded-circle mb-3 mx-auto"><i class="fa fa-users fa-lg"></i></div>
                                <h4 class="mb-1" data-i18n="auth.parentPortal">Parent Portal</h4>
                                <p class="text-muted small" data-i18n="auth.parentDesc">Monitor your child's academic progress and school activities.</p>
                            </div>
                            <div id="login-alert" class="alert d-none" role="alert"></div>
                            <form id="parent-login-form">
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="auth.email">Email Address</label>
                                    <input type="email" class="form-control" id="login-email" required data-i18n="auth.email">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="auth.password">Password</label>
                                    <input type="password" class="form-control" id="login-password" required data-i18n="auth.password">
                                </div>
                                <div class="d-flex justify-content-between mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="remember-me">
                                        <label class="form-check-label small" for="remember-me">Remember me</label>
                                    </div>
                                    <a href="forgot-password.html" class="small text-decoration-none" data-i18n="auth.forgotPassword">Forgot Password?</a>
                                </div>
                                <div class="text-center">
                                    <button type="submit" class="btn btn-primary rounded-pill login-submit-btn" data-i18n="auth.login">Log In</button>
                                </div>
                            </form>

                            <div class="my-3">
                                <div class="position-relative text-center my-4">
                                    <hr class="border-top">
                                    <span class="bg-light px-2 position-absolute top-50 start-50 translate-middle text-muted small">OR</span>
                                </div>
                                <div class="text-center">
                                    <a href="#" id="google-login-btn" class="btn google-signin-btn rounded-pill d-inline-flex align-items-center justify-content-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48" class="me-2">
                                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                                    </svg>
                                    <span data-i18n="auth.continueWithGoogle">Continue with Google</span>
                                </a>
                                </div>
                            </div>

                            <hr class="my-4">
                            <p class="text-center text-muted small mb-0">
                                <span data-i18n="auth.noAccount">Don't have an account?</span>
                                <a href="register.html" class="text-decoration-none" data-i18n="auth.registerHere">Register here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/components.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        IremeComponents.initPage('parent-login.html');
        if (IremeAuth.isLoggedIn() && IremeAuth.hasRole('parent')) { window.location.href = 'parent-dashboard.html'; }
        document.getElementById('parent-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('login-email').value.trim();
            var password = document.getElementById('login-password').value;
            var alertEl = document.getElementById('login-alert');
            var submitBtn = this.querySelector('button[type="submit"]');

            function setLoading(loading) {
                if (submitBtn) {
                    submitBtn.disabled = loading;
                    if (loading) {
                        submitBtn.dataset.originalHtml = submitBtn.innerHTML;
                        submitBtn.textContent = 'Signing in...';
                    } else if (submitBtn.dataset.originalHtml) {
                        submitBtn.innerHTML = submitBtn.dataset.originalHtml;
                    }
                }
            }

            alertEl.classList.add('d-none');
            setLoading(true);

            IremeAuth.login(email, password).then(function(result) {
                if (result.success) {
                    if (!IremeAuth.hasRole('parent')) {
                        IremeAuth.logout();
                        setLoading(false);
                        alertEl.className = 'alert alert-danger';
                        alertEl.textContent = 'This account does not have parent access.';
                        alertEl.classList.remove('d-none');
                        return;
                    }
                    alertEl.className = 'alert alert-success';
                    alertEl.textContent = 'Login successful! Redirecting...';
                    alertEl.classList.remove('d-none');
                    setTimeout(function() { window.location.href = 'parent-dashboard.html'; }, 800);
                } else {
                    setLoading(false);
                    alertEl.className = 'alert alert-danger';
                    if (result.error === 'pending') {
                        window.location.href = 'account-pending.html';
                    } else if (result.error === 'suspended') {
                        window.location.href = 'account-suspended.html';
                    } else {
                        alertEl.textContent = result.error;
                        alertEl.classList.remove('d-none');
                    }
                }
            });
        });

        document.getElementById('google-login-btn').addEventListener('click', function(e) {
            e.preventDefault();
            if (typeof IremeAPI === 'undefined') return;
            window.location.href = IremeAPI.googleLoginUrl('PARENT');
        });
    </script>
</body>
</html>
