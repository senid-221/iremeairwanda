<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - School Fees</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="schoolFees.title">School Fees & Payments</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="schoolFees.title">School Fees</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Content Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <!-- Child Selector -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold" data-i18n="schoolFees.selectChild">Select Child</label>
                    <select id="child-select" class="form-select rounded-pill px-4 py-2">
                        <option value="">Loading...</option>
                    </select>
                </div>
            </div>

            <!-- Summary Stats -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="bg-white rounded shadow-sm p-4 text-center">
                        <h3 class="text-danger mb-0" id="stat-balance">0 RWF</h3>
                        <small class="text-muted" data-i18n="schoolFees.balance">Outstanding Balance</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="bg-white rounded shadow-sm p-4 text-center">
                        <h3 class="text-success mb-0" id="stat-paid">0 RWF</h3>
                        <small class="text-muted" data-i18n="schoolFees.paid">Total Paid</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="bg-white rounded shadow-sm p-4 text-center">
                        <h3 class="text-primary mb-0" id="stat-total">0 RWF</h3>
                        <small class="text-muted" data-i18n="schoolFees.total">Total Fees</small>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Fee Structure -->
                <div class="col-lg-7">
                    <div class="bg-light rounded p-4">
                        <h5 class="mb-3" data-i18n="schoolFees.feeStructure">Fee Structure</h5>
                        <div class="table-responsive">
                            <table class="table table-hover bg-white rounded">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-3">Item</th>
                                        <th>Amount</th>
                                        <th data-i18n="schoolFees.dueDate">Due Date</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="fee-table-body">
                                    <tr><td colspan="5" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Payment Form -->
                <div class="col-lg-5">
                    <div class="bg-light rounded p-4 mb-4">
                        <h5 class="mb-3"><i class="fa fa-credit-card text-primary me-2"></i><span data-i18n="schoolFees.payNow">Pay Now</span></h5>
                        <form id="payment-form">
                            <div class="mb-3">
                                <label class="form-label fw-bold" data-i18n="schoolFees.amount">Amount</label>
                                <div class="input-group">
                                    <input type="number" id="pay-amount" class="form-control" min="100" required>
                                    <span class="input-group-text">RWF</span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold" data-i18n="schoolFees.method">Payment Method</label>
                                <select id="pay-method" class="form-select" required>
                                    <option value="MOMO" data-i18n="schoolFees.momo">Mobile Money (MoMo)</option>
                                    <option value="BANK" data-i18n="schoolFees.bank">Bank Transfer</option>
                                </select>
                            </div>
                            <div id="momo-phone-wrap" class="mb-3">
                                <label class="form-label fw-bold">MoMo Phone Number</label>
                                <input type="tel" id="momo-phone" class="form-control" placeholder="+25078XXXXXXX">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3">
                                <i class="fa fa-lock me-2"></i>
                                <span data-i18n="schoolFees.confirm">Confirm Payment</span>
                            </button>
                        </form>
                        <div id="pay-error" class="alert alert-danger mt-3" style="display:none"></div>
                        <div id="pay-success" class="alert alert-success mt-3" style="display:none"></div>
                    </div>

                    <!-- Payment History -->
                    <div class="bg-light rounded p-4">
                        <h5 class="mb-3" data-i18n="schoolFees.paymentHistory">Payment History</h5>
                        <div id="payment-history">
                            <p class="text-muted small" data-i18n="schoolFees.noPayments">No payments made yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Content End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        IremeComponents.initPage('school-fees.html');
        IremeAuth.requireAuth();

        function formatRWF(amount) {
            return new Intl.NumberFormat('en-RW').format(amount || 0) + ' RWF';
        }

        function loadChildren() {
            IremeAPI.getChildren().then(function(data) {
                var select = document.getElementById('child-select');
                select.innerHTML = '<option value="">Select Child</option>';
                var children = data.children || [];
                children.forEach(function(c) {
                    var option = document.createElement('option');
                    option.value = c.id;
                    option.textContent = (c.firstName || '') + ' ' + (c.lastName || '');
                    select.appendChild(option);
                });
                if (children.length > 0) {
                    select.value = children[0].id;
                    loadFees(children[0].id);
                    loadPaymentHistory();
                }
            }).catch(function(err) {
                console.error('Failed to load children:', err);
            });
        }

        function loadFees(childId) {
            IremeAPI.getSchoolFees().then(function(data) {
                var fees = data.fees || [];
                var balance = data.balance || 0;
                var paid = data.totalPaid || 0;
                var total = data.totalFees || (balance + paid);

                document.getElementById('stat-balance').textContent = formatRWF(balance);
                document.getElementById('stat-paid').textContent = formatRWF(paid);
                document.getElementById('stat-total').textContent = formatRWF(total);

                var tbody = document.getElementById('fee-table-body');
                if (!fees.length) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No fee items</td></tr>';
                    return;
                }

                tbody.innerHTML = fees.map(function(f) {
                    var status = f.paid ? '<span class="badge bg-success">Paid</span>' : f.dueDate && new Date(f.dueDate) < new Date() ? '<span class="badge bg-danger">Overdue</span>' : '<span class="badge bg-warning">Pending</span>';
                    var action = f.paid ? '-' : '<button class="btn btn-primary btn-sm rounded-pill" onclick="document.getElementById(\'pay-amount\').value=' + (f.amount || 0) + '">Pay</button>';
                    return '<tr>' +
                        '<td class="ps-3 fw-bold">' + (f.item || f.name || 'Fee') + '</td>' +
                        '<td>' + formatRWF(f.amount) + '</td>' +
                        '<td>' + (f.dueDate ? new Date(f.dueDate).toLocaleDateString() : '-') + '</td>' +
                        '<td>' + status + '</td>' +
                        '<td>' + action + '</td>' +
                        '</tr>';
                }).join('');
            }).catch(function(err) {
                console.error('Failed to load fees:', err);
            });
        }

        function loadPaymentHistory() {
            IremeAPI.getPaymentHistory().then(function(data) {
                var container = document.getElementById('payment-history');
                var payments = data.payments || [];
                if (!payments.length) {
                    container.innerHTML = '<p class="text-muted small">' + IremeI18n.t('schoolFees.noPayments') + '</p>';
                    return;
                }
                container.innerHTML = payments.slice(0, 5).map(function(p) {
                    return '<div class="border-bottom py-2">' +
                        '<div class="d-flex justify-content-between">' +
                        '<small class="fw-bold text-success">' + formatRWF(p.amount) + '</small>' +
                        '<small class="text-muted">' + new Date(p.createdAt).toLocaleDateString() + '</small>' +
                        '</div>' +
                        '<small class="text-muted">' + (p.method || 'Payment') + '</small>' +
                        '</div>';
                }).join('');
            }).catch(function(err) {
                console.error('Failed to load payments:', err);
            });
        }

        document.getElementById('child-select').addEventListener('change', function() {
            if (this.value) loadFees(this.value);
        });

        document.getElementById('pay-method').addEventListener('change', function() {
            document.getElementById('momo-phone-wrap').style.display = this.value === 'MOMO' ? 'block' : 'none';
        });

        document.getElementById('payment-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var errorDiv = document.getElementById('pay-error');
            var successDiv = document.getElementById('pay-success');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            var data = {
                childId: document.getElementById('child-select').value,
                amount: parseInt(document.getElementById('pay-amount').value),
                method: document.getElementById('pay-method').value,
                phone: document.getElementById('momo-phone').value || null
            };

            IremeAPI.initiatePayment(data).then(function() {
                successDiv.textContent = IremeI18n.t('schoolFees.success');
                successDiv.style.display = 'block';
                document.getElementById('payment-form').reset();
                loadFees(data.childId);
                loadPaymentHistory();
            }).catch(function(err) {
                errorDiv.textContent = err.message || 'Payment failed';
                errorDiv.style.display = 'block';
            });
        });

        loadChildren();
    </script>
</body>
</html>
