<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Student Report</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="studentReport.title">Submit Student Report</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="studentReport.title">Student Report</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>

    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="bg-light rounded p-4">
                        <h4 class="mb-4"><i class="fa fa-file-signature text-primary me-2"></i><span data-i18n="studentReport.title">Submit Student Report</span></h4>
                        <form id="report-form">
                            <div class="mb-3">
                                <label class="form-label" data-i18n="studentReport.selectStudent">Select Student</label>
                                <input type="text" id="report-student" class="form-control" placeholder="Search student name..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" data-i18n="studentReport.reportType">Report Type</label>
                                <select id="report-type" class="form-select" required>
                                    <option value="academic" data-i18n="studentReport.academic">Academic Report</option>
                                    <option value="behavioral" data-i18n="studentReport.behavioral">Behavioral Report</option>
                                    <option value="progress" data-i18n="studentReport.progress">Progress Report</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" data-i18n="studentReport.comments">Comments</label>
                                <textarea id="report-comments" class="form-control" rows="5" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Performance Rating</label>
                                <select id="report-rating" class="form-select">
                                    <option value="excellent">Excellent</option>
                                    <option value="good" selected>Good</option>
                                    <option value="average">Average</option>
                                    <option value="below_average">Below Average</option>
                                    <option value="poor">Poor</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary rounded-pill px-4"><i class="fa fa-paper-plane me-1"></i> <span data-i18n="studentReport.submit">Submit Report</span></button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="bg-light rounded p-4">
                        <h4 class="mb-3" data-i18n="studentReport.recent">Recent Reports</h4>
                        <div id="recent-reports"></div>
                        <div id="recent-empty" class="text-center py-3">
                            <p class="text-muted" data-i18n="studentReport.noReports">No reports submitted yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        IremeComponents.initPage('student-report.html');
        IremeAuth.requireRole('teacher');

        document.getElementById('report-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var data = {
                studentName: document.getElementById('report-student').value,
                type: document.getElementById('report-type').value,
                comments: document.getElementById('report-comments').value,
                rating: document.getElementById('report-rating').value
            };
            IremeAPI.submitStudentReport(data).then(function() {
                alert('Report submitted successfully');
                document.getElementById('report-form').reset();
                loadRecent();
            }).catch(function(e) { alert('Error: ' + (e.message || 'Could not submit report')); });
        });

        function loadRecent() {
            IremeAPI.getStudentReports().then(function(data) {
                var reports = data.reports || [];
                if (reports.length === 0) return;
                document.getElementById('recent-empty').style.display = 'none';
                document.getElementById('recent-reports').innerHTML = reports.slice(0, 5).map(function(r) {
                    var date = r.createdAt ? new Date(r.createdAt).toLocaleDateString() : '';
                    var typeColor = r.type === 'academic' ? 'bg-primary' : r.type === 'behavioral' ? 'bg-warning text-dark' : 'bg-info';
                    return '<div class="border-bottom py-2 mb-2"><div class="d-flex justify-content-between">' +
                        '<strong>' + (r.studentName || 'Student') + '</strong><span class="badge ' + typeColor + '">' + (r.type || '') + '</span></div>' +
                        '<small class="text-muted">' + date + '</small>' +
                        '<p class="small mb-0 mt-1">' + (r.comments || '').substring(0, 80) + '</p></div>';
                }).join('');
            }).catch(function() {});
        }

        loadRecent();
    </script>
</body>
</html>
