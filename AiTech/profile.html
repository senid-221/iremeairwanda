<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - My Profile</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="profile.title">My Profile</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" data-i18n="profile.title">My Profile</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-5">
        <div class="container">
            <div class="row g-4">
                <!-- Profile Info Card -->
                <div class="col-lg-4 wow fadeIn" data-wow-delay="0.1s">
                    <div class="service-item rounded text-center p-4">
                        <div class="btn-square bg-primary text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width:80px;height:80px;font-size:2rem">
                            <i class="fa fa-user"></i>
                        </div>
                        <h4 class="fw-bold" id="profile-name">—</h4>
                        <p class="text-muted mb-2" id="profile-email">—</p>
                        <span class="badge bg-primary rounded-pill" id="profile-role">—</span>
                        <hr>
                        <div class="text-start">
                            <p class="mb-2"><i class="fa fa-check-circle text-success me-2"></i><span data-i18n="profile.status">Status</span>: <strong id="profile-status">—</strong></p>
                            <p class="mb-2"><i class="fa fa-calendar me-2 text-muted"></i><span data-i18n="profile.joined">Joined</span>: <span id="profile-joined">—</span></p>
                            <p class="mb-0"><i class="fa fa-clock me-2 text-muted"></i><span data-i18n="profile.lastLogin">Last login</span>: <span id="profile-last-login">—</span></p>
                        </div>
                    </div>
                </div>

                <!-- Edit Profile Form -->
                <div class="col-lg-8 wow fadeIn" data-wow-delay="0.2s">
                    <div class="bg-light rounded p-4">
                        <h4 class="mb-4"><i class="fa fa-edit text-primary me-2"></i><span data-i18n="profile.editTitle">Edit Profile</span></h4>
                        <form id="profile-form">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" data-i18n="profile.fullName">Full Name</label>
                                    <input type="text" class="form-control" id="profile-input-name" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" data-i18n="profile.phone">Phone Number</label>
                                    <input type="tel" class="form-control" id="profile-input-phone">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" data-i18n="profile.language">Preferred Language</label>
                                    <select class="form-select" id="profile-input-language">
                                        <option value="en">English</option>
                                        <option value="rw">Kinyarwanda</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" data-i18n="profile.timezone">Timezone</label>
                                    <select class="form-select" id="profile-input-timezone">
                                        <option value="Africa/Kigali">Africa/Kigali (CAT, UTC+2)</option>
                                        <option value="UTC">UTC</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Location</label>
                                    <div id="profile-location-selector"></div>
                                </div>
                                <div class="col-12">
                                    <div id="profile-message"></div>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary rounded-pill px-4" id="profile-save-btn">
                                        <i class="fa fa-save me-2"></i><span data-i18n="profile.save">Save Changes</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Security Settings -->
                    <div class="bg-light rounded p-4 mt-4 wow fadeIn" data-wow-delay="0.3s">
                        <h4 class="mb-4"><i class="fa fa-shield-alt text-primary me-2"></i><span data-i18n="profile.security">Security</span></h4>
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-outline-primary rounded-pill px-4" id="change-password-btn">
                                <i class="fa fa-key me-2"></i><span data-i18n="profile.changePassword">Change Password</span>
                            </button>
                            <button class="btn btn-outline-primary rounded-pill px-4" id="logout-btn">
                                <i class="fa fa-sign-out-alt me-2"></i><span data-i18n="profile.logout">Sign Out</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/rwanda-admin.js"></script>
    <script src="js/location-selector.js"></script>
    <script src="js/game-state.js"></script>
    <script>
        IremeComponents.initPage('profile.html', ['js/game-state.js']);
        if (!IremeAuth.requireAuth()) { }

        // Initialize location selector for profile
        IremeLocation.init('profile-location-selector', { required: false });

        var ROLE_LABELS = {
            STUDENT: 'Student', TEACHER: 'Teacher', PARENT: 'Parent',
            HEADTEACHER: 'Headteacher', ADMIN: 'Administrator', SUPER_ADMIN: 'Super Administrator',
        };

        IremeAPI.getCurrentUser().then(function(user) {
            document.getElementById('profile-name').textContent = user.fullName || '—';
            document.getElementById('profile-email').textContent = user.email || '—';
            document.getElementById('profile-role').textContent = ROLE_LABELS[user.role] || user.role || '—';
            document.getElementById('profile-status').textContent = user.status || '—';
            document.getElementById('profile-joined').textContent = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : '—';
            document.getElementById('profile-last-login').textContent = user.lastLoginAt ? new Date(user.lastLoginAt).toLocaleDateString() : '—';

            document.getElementById('profile-input-name').value = user.fullName || '';
            document.getElementById('profile-input-phone').value = user.phone || '';
        }).catch(function() {
            document.getElementById('profile-name').textContent = '—';
        });

        function showMessage(type, text) {
            var el = document.getElementById('profile-message');
            el.innerHTML = '<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">' +
                text + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
        }

        document.getElementById('profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var btn = document.getElementById('profile-save-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

            IremeAPI.patch('/api/auth/profile', {
                fullName: document.getElementById('profile-input-name').value,
                phone: document.getElementById('profile-input-phone').value,
                preferredLanguage: document.getElementById('profile-input-language').value,
                timezone: document.getElementById('profile-input-timezone').value,
                province: (IremeLocation.getSelection('profile-location-selector') || {}).province || null,
                district: (IremeLocation.getSelection('profile-location-selector') || {}).district || null,
                sector: (IremeLocation.getSelection('profile-location-selector') || {}).sector || null,
                cell: (IremeLocation.getSelection('profile-location-selector') || {}).cell || null,
                village: (IremeLocation.getSelection('profile-location-selector') || {}).village || null,
            }).then(function() {
                showMessage('success', 'Profile updated successfully.');
                document.getElementById('profile-name').textContent = document.getElementById('profile-input-name').value;
            }).catch(function(err) {
                showMessage('danger', err.error || 'Failed to update profile. Please try again.');
            }).finally(function() {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-save me-2"></i>Save Changes';
            });
        });

        document.getElementById('change-password-btn').addEventListener('click', function() {
            showMessage('info', 'Please contact support to change your password.');
        });

        document.getElementById('logout-btn').addEventListener('click', function() {
            IremeAuth.logout();
        });
    </script>
</body>
</html>
