<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - View Grades</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="viewGrades.title">View Grades by Subject</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="viewGrades.title">View Grades</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Content Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <!-- Filters -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold" data-i18n="viewGrades.selectChild">Select Child</label>
                    <select id="child-select" class="form-select rounded-pill px-4 py-2">
                        <option value="">Loading...</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" data-i18n="viewGrades.selectTerm">Select Term</label>
                    <select id="term-select" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="viewGrades.allTerms">All Terms</option>
                        <option value="1">Term 1</option>
                        <option value="2">Term 2</option>
                        <option value="3">Term 3</option>
                    </select>
                </div>
            </div>

            <!-- Summary Stats -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="bg-white rounded shadow-sm p-3 text-center">
                        <h3 class="text-primary mb-0" id="stat-avg">0%</h3>
                        <small class="text-muted" data-i18n="viewGrades.average">Average</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="bg-white rounded shadow-sm p-3 text-center">
                        <h3 class="text-success mb-0" id="stat-highest">0%</h3>
                        <small class="text-muted">Highest Score</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="bg-white rounded shadow-sm p-3 text-center">
                        <h3 class="text-warning mb-0" id="stat-subjects">0</h3>
                        <small class="text-muted">Subjects</small>
                    </div>
                </div>
            </div>

            <!-- Grades Table -->
            <div class="bg-white rounded shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4" data-i18n="viewGrades.subject">Subject</th>
                                <th data-i18n="viewGrades.score">Score</th>
                                <th data-i18n="viewGrades.grade">Grade</th>
                                <th data-i18n="viewGrades.teacher">Teacher</th>
                                <th data-i18n="viewGrades.term">Term</th>
                                <th data-i18n="viewGrades.comments">Comments</th>
                            </tr>
                        </thead>
                        <tbody id="grades-body">
                            <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Empty State -->
            <div id="grades-empty" class="text-center py-5" style="display:none">
                <i class="fa fa-star fa-3x text-muted mb-3"></i>
                <h4 data-i18n="viewGrades.noGrades">No grades available</h4>
            </div>
        </div>
    </div>
    <!-- Content End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        IremeComponents.initPage('view-grades.html');
        IremeAuth.requireAuth();

        var allGrades = [];

        function loadChildren() {
            IremeAPI.getChildren().then(function(data) {
                var select = document.getElementById('child-select');
                select.innerHTML = '<option value="">Select Child</option>';
                var children = data.children || [];
                children.forEach(function(c) {
                    var option = document.createElement('option');
                    option.value = c.id;
                    option.textContent = (c.firstName || '') + ' ' + (c.lastName || '');
                    select.appendChild(option);
                });
                if (children.length > 0) {
                    select.value = children[0].id;
                    loadGrades(children[0].id);
                }
            }).catch(function(err) {
                console.error('Failed to load children:', err);
            });
        }

        function loadGrades(childId) {
            if (!childId) {
                document.getElementById('grades-body').innerHTML = '';
                document.getElementById('grades-empty').style.display = 'block';
                return;
            }
            IremeAPI.getChildGrades(childId).then(function(data) {
                allGrades = data.grades || [];
                filterAndDisplay();
            }).catch(function(err) {
                console.error('Failed to load grades:', err);
                document.getElementById('grades-body').innerHTML = '';
                document.getElementById('grades-empty').style.display = 'block';
            });
        }

        function filterAndDisplay() {
            var term = document.getElementById('term-select').value;
            var filtered = allGrades;
            if (term) {
                filtered = allGrades.filter(function(g) { return String(g.term) === term; });
            }

            if (filtered.length === 0) {
                document.getElementById('grades-body').innerHTML = '';
                document.getElementById('grades-empty').style.display = 'block';
                document.getElementById('stat-avg').textContent = '0%';
                document.getElementById('stat-highest').textContent = '0%';
                document.getElementById('stat-subjects').textContent = '0';
                return;
            }

            document.getElementById('grades-empty').style.display = 'none';

            var scores = filtered.map(function(g) { return g.score || 0; });
            var avg = Math.round(scores.reduce(function(a, b) { return a + b; }, 0) / scores.length);
            var highest = Math.max.apply(null, scores);
            document.getElementById('stat-avg').textContent = avg + '%';
            document.getElementById('stat-highest').textContent = highest + '%';
            document.getElementById('stat-subjects').textContent = filtered.length;

            var tbody = document.getElementById('grades-body');
            tbody.innerHTML = filtered.map(function(g) {
                var score = g.score || 0;
                var grade = score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : score >= 60 ? 'D' : 'F';
                var gradeColor = score >= 70 ? 'text-success' : score >= 60 ? 'text-warning' : 'text-danger';
                return '<tr>' +
                    '<td class="ps-4 fw-bold">' + (g.subjectName || g.subject || 'N/A') + '</td>' +
                    '<td><span class="fw-bold">' + score + '%</span></td>' +
                    '<td><span class="fw-bold ' + gradeColor + '">' + grade + '</span></td>' +
                    '<td>' + (g.teacherName || g.teacher || 'N/A') + '</td>' +
                    '<td>Term ' + (g.term || '-') + '</td>' +
                    '<td><small class="text-muted">' + (g.comments || '-') + '</small></td>' +
                    '</tr>';
            }).join('');
        }

        document.getElementById('child-select').addEventListener('change', function() {
            loadGrades(this.value);
        });
        document.getElementById('term-select').addEventListener('change', filterAndDisplay);

        loadChildren();
    </script>
</body>
</html>
