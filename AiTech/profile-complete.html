<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - IREME Rwanda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .profile-complete-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #1363C6 0%, #0d4a94 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .profile-complete-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 700px;
            width: 100%;
            padding: 2.5rem;
        }
        .profile-complete-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .profile-complete-header h1 {
            font-family: 'Ubuntu', sans-serif;
            font-weight: 700;
            color: #1363C6;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        .profile-complete-header p {
            color: #6c757d;
            font-size: 0.95rem;
        }
        .form-section {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e9ecef;
        }
        .form-section:last-child {
            border-bottom: none;
        }
        .form-section-title {
            font-family: 'Ubuntu', sans-serif;
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-section-title i {
            color: #1363C6;
        }
        .file-upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 0.5rem;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .file-upload-area:hover {
            border-color: #1363C6;
            background: #f0f7ff;
        }
        .file-upload-area.has-file {
            border-color: #28a745;
            background: #f0fff4;
        }
        .file-upload-area i {
            font-size: 2rem;
            color: #1363C6;
            margin-bottom: 0.5rem;
        }
        .file-upload-area.has-file i {
            color: #28a745;
        }
        .face-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1363C6;
            margin: 0 auto 1rem;
            display: none;
        }
        .face-preview.visible {
            display: block;
        }
        .submit-btn {
            background: #1363C6;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 2rem;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            background: #0d4a94;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(19, 99, 198, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="profile-complete-page">
        <div class="profile-complete-card">
            <div class="profile-complete-header">
                <h1>Complete Your Profile</h1>
                <p>Please fill in your details to continue</p>
            </div>

            <form id="profile-complete-form">
                <div class="form-section">
                    <div class="form-section-title">
                        <i class="fas fa-user"></i>
                        <span>Personal Information</span>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="full-name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" placeholder="07X XXX XXXX">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="date-of-birth">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <select class="form-select" id="gender">
                                <option value="">Select gender</option>
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">
                        <i class="fas fa-graduation-cap"></i>
                        <span>Education Information</span>
                    </div>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">I am a... *</label>
                            <select class="form-select" id="education-track" required>
                                <option value="">Select option</option>
                                <option value="study">Student (I want to learn)</option>
                                <option value="teach">Teacher (I want to teach)</option>
                            </select>
                        </div>
                        <div class="col-12" id="school-selection-wrapper">
                            <label class="form-label">School *</label>
                            <select class="form-select" id="school-select" required>
                                <option value="">Select your school</option>
                            </select>
                        </div>
                        <div class="col-md-6" id="class-selection-wrapper">
                            <label class="form-label">Class/Grade</label>
                            <select class="form-select" id="class-select">
                                <option value="">Select class</option>
                            </select>
                        </div>
                        <div class="col-md-6" id="student-id-wrapper">
                            <label class="form-label">Student ID Number</label>
                            <input type="text" class="form-control" id="student-id" placeholder="Your student ID">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Location</span>
                    </div>
                    <div id="profile-location-selector"></div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">
                        <i class="fas fa-file-alt"></i>
                        <span>Documents</span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Upload CV (PDF, DOC, DOCX - max 5MB)</label>
                        <div class="file-upload-area" id="cv-upload-area">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p class="mb-0">Click to upload or drag and drop</p>
                            <input type="file" id="cv-file" accept=".pdf,.doc,.docx" style="display: none;">
                        </div>
                        <div id="cv-file-name" class="mt-2 text-success d-none">
                            <i class="fas fa-check-circle"></i> <span></span>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">
                        <i class="fas fa-camera"></i>
                        <span>Face Scan</span>
                    </div>
                    <p class="text-muted small mb-3">Upload a clear photo of your face for identification</p>
                    <img id="face-preview" class="face-preview" alt="Face preview">
                    <div class="file-upload-area" id="face-upload-area">
                        <i class="fas fa-camera"></i>
                        <p class="mb-0">Click to take or upload photo</p>
                        <input type="file" id="face-file" accept="image/*" capture="user" style="display: none;">
                    </div>
                    <div id="face-file-name" class="mt-2 text-success d-none">
                        <i class="fas fa-check-circle"></i> <span></span>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span id="submit-text">Complete Profile</span>
                    <span id="submit-spinner" class="d-none">
                        <span class="spinner-border spinner-border-sm me-2"></span>
                        Saving...
                    </span>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/rwanda-admin.js"></script>
    <script src="js/location-selector.js"></script>
    <script>
        (function() {
            var session = IremeAuth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            if (session.profileComplete) {
                window.location.href = IremeAuth.getDashboardUrl(session.role);
                return;
            }

            document.getElementById('full-name').value = session.fullName || '';

            IremeLocation.init('profile-location-selector', { required: false });

            var cvFile = null;
            var faceFile = null;
            var cvUrl = null;
            var faceUrl = null;

            var cvUploadArea = document.getElementById('cv-upload-area');
            var cvFileInput = document.getElementById('cv-file');
            var cvFileName = document.getElementById('cv-file-name');

            cvUploadArea.addEventListener('click', function() {
                cvFileInput.click();
            });

            cvFileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    cvFile = e.target.files[0];
                    cvUploadArea.classList.add('has-file');
                    cvFileName.classList.remove('d-none');
                    cvFileName.querySelector('span').textContent = cvFile.name;
                }
            });

            var faceUploadArea = document.getElementById('face-upload-area');
            var faceFileInput = document.getElementById('face-file');
            var faceFileName = document.getElementById('face-file-name');
            var facePreview = document.getElementById('face-preview');

            faceUploadArea.addEventListener('click', function() {
                faceFileInput.click();
            });

            faceFileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    faceFile = e.target.files[0];
                    faceUploadArea.classList.add('has-file');
                    faceFileName.classList.remove('d-none');
                    faceFileName.querySelector('span').textContent = faceFile.name;

                    var reader = new FileReader();
                    reader.onload = function(e) {
                        facePreview.src = e.target.result;
                        facePreview.classList.add('visible');
                    };
                    reader.readAsDataURL(faceFile);
                }
            });

            var educationTrack = document.getElementById('education-track');
            var schoolWrapper = document.getElementById('school-selection-wrapper');
            var classWrapper = document.getElementById('class-selection-wrapper');
            var studentIdWrapper = document.getElementById('student-id-wrapper');

            educationTrack.addEventListener('change', function() {
                var track = this.value;
                if (track === 'study') {
                    schoolWrapper.style.display = 'block';
                    classWrapper.style.display = 'block';
                    studentIdWrapper.style.display = 'block';
                    loadSchools();
                } else if (track === 'teach') {
                    schoolWrapper.style.display = 'block';
                    classWrapper.style.display = 'none';
                    studentIdWrapper.style.display = 'none';
                    loadSchools();
                } else {
                    schoolWrapper.style.display = 'none';
                    classWrapper.style.display = 'none';
                    studentIdWrapper.style.display = 'none';
                }
            });

            function loadSchools() {
                var schoolSelect = document.getElementById('school-select');
                schoolSelect.innerHTML = '<option value="">Select your school</option>';
                IremeAPI.get('/api/schools?limit=10000').then(function(res) {
                    var schools = res.schools || [];
                    schools.sort(function(a, b) {
                        return (a.name || '').localeCompare(b.name || '');
                    });
                    schools.forEach(function(school) {
                        var option = document.createElement('option');
                        option.value = school.id;
                        option.textContent = school.name;
                        schoolSelect.appendChild(option);
                    });
                }).catch(function(err) {
                    console.error('Failed to load schools:', err);
                });
            }

            var form = document.getElementById('profile-complete-form');
            var submitBtn = document.getElementById('submit-btn');
            var submitText = document.getElementById('submit-text');
            var submitSpinner = document.getElementById('submit-spinner');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                submitBtn.disabled = true;
                submitText.classList.add('d-none');
                submitSpinner.classList.remove('d-none');

                var uploadPromises = [];

                if (cvFile) {
                    var cvFormData = new FormData();
                    cvFormData.append('cv', cvFile);
                    uploadPromises.push(
                        fetch(IremeAPI.getBaseUrl() + '/api/auth/upload-cv', {
                            method: 'POST',
                            credentials: 'include',
                            body: cvFormData
                        }).then(function(r) { return r.json(); }).then(function(data) {
                            if (data.cvUrl) cvUrl = data.cvUrl;
                        })
                    );
                }

                if (faceFile) {
                    var faceFormData = new FormData();
                    faceFormData.append('face', faceFile);
                    uploadPromises.push(
                        fetch(IremeAPI.getBaseUrl() + '/api/auth/upload-face', {
                            method: 'POST',
                            credentials: 'include',
                            body: faceFormData
                        }).then(function(r) { return r.json(); }).then(function(data) {
                            if (data.faceUrl) faceUrl = data.faceUrl;
                        })
                    );
                }

                Promise.all(uploadPromises).then(function() {
                    var locSel = IremeLocation.getSelection('profile-location-selector');
                    var data = {
                        fullName: document.getElementById('full-name').value.trim(),
                        phone: document.getElementById('phone').value.trim() || null,
                        dateOfBirth: document.getElementById('date-of-birth').value || null,
                        gender: document.getElementById('gender').value || null,
                        educationTrack: educationTrack.value,
                        schoolId: document.getElementById('school-select').value || null,
                        classId: document.getElementById('class-select').value || null,
                        studentId: document.getElementById('student-id').value.trim() || null,
                        role: session.role,
                        province: locSel.province || null,
                        district: locSel.district || null,
                        sector: locSel.sector || null,
                        cell: locSel.cell || null,
                        village: locSel.village || null,
                        cvUrl: cvUrl,
                        faceScanUrl: faceUrl
                    };

                    return IremeAPI.post('/api/auth/complete-profile', data);
                }).then(function(res) {
                    if (res.user) {
                        var updatedSession = IremeAuth.getSession();
                        updatedSession.profileComplete = true;
                        localStorage.setItem('ireme-auth-session', JSON.stringify(updatedSession));
                    }
                    window.location.href = IremeAuth.getDashboardUrl(session.role);
                }).catch(function(err) {
                    console.error('Profile completion error:', err);
                    alert('Failed to complete profile. Please try again.');
                    submitBtn.disabled = false;
                    submitText.classList.remove('d-none');
                    submitSpinner.classList.add('d-none');
                });
            });
        })();
    </script>
</body>
</html>
