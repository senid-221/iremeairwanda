<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Staff Meeting</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="staffMeeting.title">Staff Online Meeting</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="staffMeeting.title">Staff Meeting</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>

    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <div class="bg-white rounded shadow-sm p-4 text-center h-100">
                        <i class="fa fa-video fa-3x text-primary mb-3"></i>
                        <h4 data-i18n="staffMeeting.joinMeeting">Join Meeting</h4>
                        <p class="text-muted">Enter a meeting code to join an ongoing meeting</p>
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="Meeting code..." id="join-code">
                            <button class="btn btn-primary" type="button" id="join-btn"><i class="fa fa-sign-in-alt me-1"></i> Join</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="bg-white rounded shadow-sm p-4 text-center h-100">
                        <i class="fa fa-calendar-plus fa-3x text-success mb-3"></i>
                        <h4 data-i18n="staffMeeting.scheduleMeeting">Schedule Meeting</h4>
                        <p class="text-muted">Create a new meeting and invite colleagues</p>
                        <button class="btn btn-success rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#createMeetingModal">
                            <i class="fa fa-plus me-1"></i> <span data-i18n="staffMeeting.createMeeting">Create Meeting</span>
                        </button>
                    </div>
                </div>
            </div>

            <h3 class="mb-3" data-i18n="staffMeeting.upcoming">Upcoming Meetings</h3>
            <div id="meetings-list" class="row g-4"></div>
            <div id="meetings-empty" class="text-center py-5" style="display:none;">
                <i class="fa fa-users fa-3x text-muted mb-3"></i>
                <h4 data-i18n="staffMeeting.noMeetings">No meetings scheduled</h4>
                <p class="text-muted" data-i18n="staffMeeting.noMeetingsDesc">Schedule a meeting or wait for an invitation</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createMeetingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" data-i18n="staffMeeting.createMeeting">Create Meeting</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" data-i18n="staffMeeting.meetingTitle">Meeting Title</label>
                        <input type="text" id="meeting-title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="staffMeeting.dateTime">Date & Time</label>
                        <input type="datetime-local" id="meeting-datetime" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="staffMeeting.agenda">Agenda</label>
                        <textarea id="meeting-agenda" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="create-meeting-btn">Create</button>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('staff-meeting.html');
        IremeAuth.requireRole('teacher');

        function loadMeetings() {
            IremeAPI.getMeetings().then(function(data) {
                displayMeetings(data.meetings || []);
            }).catch(function() { displayMeetings([]); });
        }

        function displayMeetings(meetings) {
            var container = document.getElementById('meetings-list');
            var empty = document.getElementById('meetings-empty');
            if (meetings.length === 0) { container.innerHTML = ''; empty.style.display = 'block'; return; }
            empty.style.display = 'none';
            container.innerHTML = meetings.map(function(m) {
                var isLive = m.status === 'live' || m.status === 'active';
                var badge = isLive ? '<span class="badge bg-danger"><i class="fa fa-circle me-1"></i>LIVE</span>' :
                    m.status === 'ended' ? '<span class="badge bg-secondary">Ended</span>' :
                    '<span class="badge bg-info">Scheduled</span>';
                var date = m.scheduledAt ? new Date(m.scheduledAt).toLocaleString() : '';
                return '<div class="col-md-6 col-lg-4"><div class="bg-white rounded shadow-sm p-4 h-100">' +
                    '<div class="d-flex justify-content-between mb-2"><h5 class="mb-0">' + (m.title || 'Meeting') + '</h5>' + badge + '</div>' +
                    '<p class="text-muted small mb-2"><i class="fa fa-calendar me-1"></i>' + date + '</p>' +
                    '<p class="text-muted small mb-2"><i class="fa fa-users me-1"></i>' + (m.participantCount || 0) + ' participants</p>' +
                    '<p class="small mb-2">' + (m.agenda || '').substring(0, 80) + '</p>' +
                    (isLive ? '<button class="btn btn-danger btn-sm rounded-pill px-3"><i class="fa fa-play me-1"></i>Join</button>' : '') +
                    '</div></div>';
            }).join('');
        }

        document.getElementById('create-meeting-btn').addEventListener('click', function() {
            var data = {
                title: document.getElementById('meeting-title').value,
                type: 'meeting',
                scheduledAt: new Date(document.getElementById('meeting-datetime').value).toISOString(),
                agenda: document.getElementById('meeting-agenda').value
            };
            IremeAPI.createMeeting(data).then(function() {
                bootstrap.Modal.getInstance(document.getElementById('createMeetingModal')).hide();
                loadMeetings();
            }).catch(function(e) { alert('Error: ' + (e.message || 'Could not create meeting')); });
        });

        document.getElementById('join-btn').addEventListener('click', function() {
            var code = document.getElementById('join-code').value;
            if (code) alert('Joining meeting: ' + code);
        });

        loadMeetings();
    </script>
</body>
</html>
