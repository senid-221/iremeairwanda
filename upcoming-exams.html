<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Ibizamini bya Vuba - IREME</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Header Start -->
    <div class="container-fluid bg-primary py-5 hero-header mb-5">
        <div class="container py-5">
            <div class="row g-5 pt-5">
                <div class="col-12 text-center text-lg-start">
                    <div class="btn btn-sm border rounded-pill text-white px-3 mb-3 animated slideInRight" data-i18n="upcomingExams.badge">Ibizamini bya Vuba</div>
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="upcomingExams.title">Ibizamini Bigiye Kuba</h1>
                    <p class="text-white mb-4 animated slideInRight" data-i18n="upcomingExams.desc">Reba ibizamini n'amasuzuma bigiye kuba mu gihe kiri imbere.</p>
                </div>
            </div>
        </div>
    </div>
    <!-- Header End -->

    <!-- Upcoming Exams Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-5">
                <div class="col-12">
                    <div id="exams-list" class="row g-4">
                        <!-- Exams will be loaded here -->
                    </div>
                    <div id="exams-empty" class="text-center py-5" style="display: none;">
                        <i class="fa fa-calendar-check fa-3x text-primary mb-3"></i>
                        <h3 data-i18n="upcomingExams.noExams">Nta bizamini biri hafi</h3>
                        <p class="text-muted" data-i18n="upcomingExams.noExamsDesc">Nta bizamini cyangwa amasuzuma biri hafi mu gihe kiri imbere.</p>
                    </div>
                    <div id="exams-loading" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3 text-muted" data-i18n="upcomingExams.loading">Gutegereza...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Upcoming Exams End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        // Check authentication
        if (!IremeAuth.isAuthenticated() || !IremeAuth.isStudent()) {
            window.location.href = 'student-login.html';
        }

        // Load upcoming exams
        async function loadUpcomingExams() {
            try {
                const response = await IremeAPI.getUpcomingAssessments(20);
                const exams = response.assessments || [];
                
                document.getElementById('exams-loading').style.display = 'none';
                
                if (exams.length === 0) {
                    document.getElementById('exams-empty').style.display = 'block';
                    return;
                }

                const examsList = document.getElementById('exams-list');
                examsList.innerHTML = exams.map(exam => {
                    const startDate = new Date(exam.startDate);
                    const dateStr = startDate.toLocaleDateString('rw-RW', { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric' 
                    });
                    const timeStr = startDate.toLocaleTimeString('rw-RW', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });

                    return `
                        <div class="col-lg-6 col-xl-4">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-body p-4">
                                    <div class="d-flex align-items-center mb-3">
                                        <div class="flex-shrink-0 bg-primary rounded-pill p-3 me-3">
                                            <i class="fa fa-file-alt text-white fa-lg"></i>
                                        </div>
                                        <div>
                                            <h5 class="card-title mb-1">${exam.title}</h5>
                                            <p class="text-muted small mb-0">${exam.subject || 'N/A'}</p>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <div class="d-flex align-items-center mb-2">
                                            <i class="fa fa-calendar text-primary me-2"></i>
                                            <span class="small">${dateStr}</span>
                                        </div>
                                        <div class="d-flex align-items-center mb-2">
                                            <i class="fa fa-clock text-primary me-2"></i>
                                            <span class="small">${timeStr}</span>
                                        </div>
                                        ${exam.timeLimitMinutes ? `
                                        <div class="d-flex align-items-center">
                                            <i class="fa fa-hourglass-half text-primary me-2"></i>
                                            <span class="small">${exam.timeLimitMinutes} min</span>
                                        </div>
                                        ` : ''}
                                    </div>
                                    ${exam.description ? `<p class="card-text small text-muted">${exam.description}</p>` : ''}
                                    <div class="mt-3">
                                        <span class="badge bg-success-subtle text-success me-2">${exam.assessmentType}</span>
                                        ${exam.totalPoints ? `<span class="badge bg-info-subtle text-info">${exam.totalPoints} pts</span>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading exams:', error);
                document.getElementById('exams-loading').style.display = 'none';
                document.getElementById('exams-empty').style.display = 'block';
            }
        }

        // Initialize page
        IremeComponents.initPage('upcoming-exams.html');
        loadUpcomingExams();
    </script>
</body>

</html>
