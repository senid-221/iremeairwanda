<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Umwarimu SACCO</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="sacco.title">Umwarimu SACCO</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="sacco.title">SACCO</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>

    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="bg-white rounded shadow-sm p-4 text-center h-100">
                        <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:56px;height:56px;">
                            <i class="fa fa-wallet text-white fa-lg"></i>
                        </div>
                        <h3 id="sacco-balance">RWF 0</h3>
                        <p class="text-muted mb-0" data-i18n="sacco.balance">Account Balance</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="bg-white rounded shadow-sm p-4 text-center h-100">
                        <div class="bg-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:56px;height:56px;">
                            <i class="fa fa-piggy-bank text-white fa-lg"></i>
                        </div>
                        <h3 id="sacco-savings">RWF 0</h3>
                        <p class="text-muted mb-0" data-i18n="sacco.savings">My Savings</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="bg-white rounded shadow-sm p-4 text-center h-100">
                        <div class="bg-info rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:56px;height:56px;">
                            <i class="fa fa-hand-holding-usd text-white fa-lg"></i>
                        </div>
                        <h3 id="sacco-loans">RWF 0</h3>
                        <p class="text-muted mb-0" data-i18n="sacco.loans">Loans</p>
                    </div>
                </div>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="d-grid"><button class="btn btn-success rounded-pill py-3"><i class="fa fa-arrow-down me-2"></i><span data-i18n="sacco.deposit">Deposit</span></button></div>
                </div>
                <div class="col-md-4">
                    <div class="d-grid"><button class="btn btn-warning rounded-pill py-3"><i class="fa fa-arrow-up me-2"></i><span data-i18n="sacco.withdraw">Withdraw</span></button></div>
                </div>
                <div class="col-md-4">
                    <div class="d-grid"><button class="btn btn-primary rounded-pill py-3"><i class="fa fa-file-invoice-dollar me-2"></i><span data-i18n="sacco.applyLoan">Apply for Loan</span></button></div>
                </div>
            </div>

            <h3 class="mb-3" data-i18n="sacco.transactionHistory">Transaction History</h3>
            <div class="bg-white rounded shadow-sm p-4">
                <div id="transactions-list"></div>
                <div id="transactions-empty" class="text-center py-4">
                    <p class="text-muted" data-i18n="sacco.noTransactions">No transactions yet</p>
                </div>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('umwarimu-sacco.html');
        IremeAuth.requireRole('teacher');

        IremeAPI.getSaccoInfo().then(function(data) {
            document.getElementById('sacco-balance').textContent = 'RWF ' + (data.balance || 0).toLocaleString();
            document.getElementById('sacco-savings').textContent = 'RWF ' + (data.savings || 0).toLocaleString();
            document.getElementById('sacco-loans').textContent = 'RWF ' + (data.loans || 0).toLocaleString();
            var txns = data.transactions || [];
            if (txns.length > 0) {
                document.getElementById('transactions-empty').style.display = 'none';
                document.getElementById('transactions-list').innerHTML = txns.map(function(t) {
                    var isCredit = t.type === 'deposit' || t.type === 'credit';
                    var icon = isCredit ? 'fa-arrow-down text-success' : 'fa-arrow-up text-danger';
                    var date = t.createdAt ? new Date(t.createdAt).toLocaleDateString() : '';
                    return '<div class="d-flex justify-content-between align-items-center border-bottom py-3">' +
                        '<div class="d-flex align-items-center"><i class="fa ' + icon + ' me-3 fa-lg"></i>' +
                        '<div><strong>' + (t.description || t.type) + '</strong><br><small class="text-muted">' + date + '</small></div></div>' +
                        '<span class="' + (isCredit ? 'text-success' : 'text-danger') + ' fw-bold">' + (isCredit ? '+' : '-') + ' RWF ' + Math.abs(t.amount || 0).toLocaleString() + '</span></div>';
                }).join('');
            }
        }).catch(function() {});
    </script>
</body>
</html>
