<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Contact Teacher</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="contactTeacher.title">Contact Class Teacher</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="contactTeacher.title">Contact Teacher</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Content Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4">
                <!-- Message Form -->
                <div class="col-lg-7 wow fadeInUp" data-wow-delay="0.1s">
                    <div class="bg-light rounded p-4 p-lg-5">
                        <div class="text-center mb-4">
                            <div class="service-icon btn-square rounded-circle mb-3 mx-auto" style="background-color: var(--primary); color: #fff; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;">
                                <i class="fa fa-envelope fa-lg"></i>
                            </div>
                            <h4 class="mb-1" data-i18n="contactTeacher.title">Contact Class Teacher</h4>
                            <p class="text-muted" data-i18n="contactTeacher.desc">Send a message to your child's class teacher</p>
                        </div>

                        <form id="message-form">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-bold" data-i18n="contactTeacher.selectTeacher">Select Teacher</label>
                                    <select id="teacher-select" class="form-select" required>
                                        <option value="">Loading teachers...</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold" data-i18n="contactTeacher.subject">Subject</label>
                                    <select id="msg-subject" class="form-select" required>
                                        <option value="GENERAL" data-i18n="contactTeacher.general">General Inquiry</option>
                                        <option value="ACADEMIC" data-i18n="contactTeacher.academic">Academic Concern</option>
                                        <option value="BEHAVIOR" data-i18n="contactTeacher.behavior">Behavior</option>
                                        <option value="ATTENDANCE" data-i18n="contactTeacher.attendance">Attendance</option>
                                        <option value="HEALTH" data-i18n="contactTeacher.health">Health & Wellbeing</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold" data-i18n="contactTeacher.message">Message</label>
                                    <textarea id="msg-body" class="form-control" rows="5" required></textarea>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary w-100 py-3">
                                        <i class="fa fa-paper-plane me-2"></i>
                                        <span data-i18n="contactTeacher.send">Send Message</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div id="form-error" class="alert alert-danger mt-3" style="display:none"></div>
                        <div id="form-success" class="alert alert-success mt-3" style="display:none"></div>
                    </div>
                </div>

                <!-- Recent Messages -->
                <div class="col-lg-5 wow fadeInUp" data-wow-delay="0.3s">
                    <div class="bg-light rounded p-4">
                        <h5 class="mb-3" data-i18n="contactTeacher.recent">Recent Messages</h5>
                        <div id="recent-messages">
                            <p class="text-muted small" data-i18n="contactTeacher.noMessages">No messages sent yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Content End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('contact-teacher.html');
        IremeAuth.requireAuth();

        // Load teachers
        IremeAPI.getSchoolTeachers().then(function(data) {
            var select = document.getElementById('teacher-select');
            select.innerHTML = '<option value="">Select Teacher</option>';
            var teachers = data.teachers || [];
            teachers.forEach(function(t) {
                var option = document.createElement('option');
                option.value = t.id;
                option.textContent = (t.firstName || '') + ' ' + (t.lastName || '') + (t.subjects && t.subjects[0] ? ' (' + (t.subjects[0].name || '') + ')' : '');
                select.appendChild(option);
            });
        }).catch(function(err) {
            console.error('Failed to load teachers:', err);
        });

        document.getElementById('message-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var errorDiv = document.getElementById('form-error');
            var successDiv = document.getElementById('form-success');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            var data = {
                teacherId: document.getElementById('teacher-select').value,
                subject: document.getElementById('msg-subject').value,
                message: document.getElementById('msg-body').value
            };

            IremeAPI.sendMessageToTeacher(data).then(function() {
                successDiv.textContent = IremeI18n.t('contactTeacher.success');
                successDiv.style.display = 'block';
                document.getElementById('message-form').reset();
                loadRecentMessages();
            }).catch(function(err) {
                errorDiv.textContent = err.message || 'Failed to send message';
                errorDiv.style.display = 'block';
            });
        });

        function loadRecentMessages() {
            IremeAPI.getParentMessages().then(function(data) {
                var container = document.getElementById('recent-messages');
                var messages = data.messages || [];
                if (messages.length === 0) {
                    container.innerHTML = '<p class="text-muted small">' + IremeI18n.t('contactTeacher.noMessages') + '</p>';
                    return;
                }
                container.innerHTML = messages.slice(0, 5).map(function(m) {
                    var date = new Date(m.createdAt).toLocaleDateString();
                    var preview = (m.message || m.body || '').substring(0, 60);
                    return '<div class="border-bottom py-2">' +
                        '<div class="d-flex justify-content-between">' +
                        '<small class="fw-bold">' + (m.teacherName || 'Teacher') + '</small>' +
                        '<small class="text-muted">' + date + '</small>' +
                        '</div>' +
                        '<small class="text-muted">' + preview + (preview.length >= 60 ? '...' : '') + '</small>' +
                        '</div>';
                }).join('');
            }).catch(function(err) {
                console.error('Failed to load messages:', err);
            });
        }

        loadRecentMessages();
    </script>
</body>
</html>
