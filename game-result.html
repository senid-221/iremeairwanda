<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME Game - Results</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        :root { --ireme-primary: #1363C6; --ireme-secondary: #15ACE1; --ireme-light: #F4F7FE; --ireme-dark: #14183E; --ireme-gold: #F4A926; --ireme-muted: #6B7A99; --ireme-line: #E5EAF4; --ireme-green: #12B981; }
        body { background: radial-gradient(ellipse at top, #1a2a5e, #0d1633 70%, #080e24); min-height: 100vh; }
        #component-navbar { display: none; }
        #component-footer { display: none; }
        #component-backtotop { display: none; }
        .results-view { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; position: relative; overflow: hidden; }
        .confetti { position: absolute; width: 10px; height: 10px; border-radius: 2px; opacity: 0; animation: confettiFall 3s ease-in infinite; }
        .confetti.c1 { left: 15%; top: -10px; background: var(--ireme-gold); animation-delay: 0s; }
        .confetti.c2 { left: 45%; top: -10px; background: var(--ireme-secondary); animation-delay: .8s; width: 8px; height: 8px; }
        .confetti.c3 { left: 75%; top: -10px; background: var(--ireme-green); animation-delay: 1.5s; width: 12px; height: 6px; }
        .confetti.c4 { left: 30%; top: -10px; background: #ff6b9d; animation-delay: .4s; width: 6px; height: 12px; }
        .confetti.c5 { left: 60%; top: -10px; background: var(--ireme-primary); animation-delay: 1.2s; }
        .confetti.c6 { left: 85%; top: -10px; background: #a78bfa; animation-delay: 2s; width: 8px; height: 8px; }
        @keyframes confettiFall { 0% { transform: translateY(-10px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        .results-content { max-width: 700px; width: 100%; text-align: center; position: relative; z-index: 2; }
        .result-eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--ireme-gold); font-weight: 800; letter-spacing: 1.7px; font-size: 10px; text-transform: uppercase; background: rgba(244,169,38,0.1); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(244,169,38,0.2); }
        .results-title { color: white; font-size: 38px; font-weight: 800; margin: 15px 0 10px; letter-spacing: -1px; }
        .results-title.win { color: var(--ireme-gold); }
        .results-title.loss { color: #ff8a8a; }
        .results-title.draw { color: var(--ireme-secondary); }
        .results-subtitle { color: #9eb1da; font-size: 13px; margin-bottom: 30px; }
        .podium { display: flex; align-items: flex-end; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .podium-player { text-align: center; padding: 20px; border-radius: 19px; min-width: 160px; }
        .podium-player.winner { background: linear-gradient(145deg, rgba(244,169,38,0.15), rgba(244,169,38,0.05)); border: 1px solid rgba(244,169,38,0.25); order: 2; transform: scale(1.05); }
        .podium-player.runner { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); order: 1; }
        .podium-player .crown { font-size: 24px; color: var(--ireme-gold); margin-bottom: 8px; }
        .podium-player .p-avatar { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: white; margin: 0 auto 10px; border: 3px solid rgba(255,255,255,0.3); }
        .podium-player.winner .p-avatar { background: linear-gradient(145deg, var(--ireme-primary), #0d4a9c); width: 82px; height: 82px; font-size: 23px; border-color: var(--ireme-gold); }
        .podium-player.runner .p-avatar { background: linear-gradient(145deg, #8f67f5, #4c2bb8); }
        .podium-player h3 { color: white; font-size: 16px; margin: 5px 0; }
        .podium-player .result-label { font-size: 8px; letter-spacing: 1px; font-weight: 800; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; display: inline-block; }
        .podium-player.winner .result-label { background: rgba(244,169,38,0.2); color: var(--ireme-gold); }
        .podium-player.runner .result-label { background: rgba(255,255,255,0.08); color: #788db8; }
        .podium-player .final-score { font-size: 28px; font-weight: 800; color: white; margin-top: 10px; }
        .podium-player .accuracy-text { font-size: 9px; color: #788db8; margin-top: 4px; }
        .score-divider { display: flex; flex-direction: column; align-items: center; color: white; order: 3; }
        .score-divider .final-score-big { font-size: 22px; font-weight: 800; background: rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .score-divider small { font-size: 7px; color: #6b7a99; letter-spacing: 1px; margin-top: 5px; text-transform: uppercase; }
        .rewards-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        .reward-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px 14px; text-align: center; }
        .reward-card .reward-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin: 0 auto 10px; font-size: 18px; }
        .reward-card .reward-icon.xp { background: rgba(244,169,38,0.15); color: var(--ireme-gold); }
        .reward-card .reward-icon.acc { background: rgba(21,172,225,0.15); color: var(--ireme-secondary); }
        .reward-card .reward-icon.streak { background: rgba(18,185,129,0.15); color: var(--ireme-green); }
        .reward-card .reward-value { font-size: 20px; font-weight: 800; color: white; }
        .reward-card .reward-label { font-size: 8px; color: #6b7a99; letter-spacing: 0.5px; margin-top: 3px; text-transform: uppercase; }
        .ai-feedback { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 22px; text-align: left; margin-bottom: 25px; }
        .ai-feedback-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .ai-feedback-header .ai-chip { display: flex; align-items: center; gap: 6px; background: rgba(19,99,198,0.2); color: var(--ireme-secondary); padding: 5px 10px; border-radius: 7px; font-size: 8px; font-weight: 700; border: 1px solid rgba(21,172,225,0.2); }
        .ai-feedback-header h4 { color: white; font-size: 14px; margin: 0; }
        .ai-feedback ul { list-style: none; padding: 0; margin: 0; }
        .ai-feedback li { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; color: #9eb1da; font-size: 11px; line-height: 1.5; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .ai-feedback li:last-child { border-bottom: 0; }
        .ai-feedback li i { color: var(--ireme-secondary); margin-top: 3px; flex: none; font-size: 10px; }
        .result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .result-actions .btn-primary-cta { border: 0; min-height: 48px; border-radius: 13px; padding: 0 24px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 11px; cursor: pointer; transition: .2s; background: linear-gradient(135deg, #ffd84e, #ffb900); color: #17213e; box-shadow: 0 10px 25px rgba(255,185,0,0.25); text-decoration: none; }
        .result-actions .btn-primary-cta:hover { transform: translateY(-2px); box-shadow: 0 13px 30px rgba(255,185,0,0.35); }
        .result-actions .btn-secondary-cta { border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: white; min-height: 48px; border-radius: 13px; padding: 0 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 10px; cursor: pointer; transition: .2s; text-decoration: none; }
        .result-actions .btn-secondary-cta:hover { background: rgba(255,255,255,0.1); }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 48px; color: #3a4a7a; margin-bottom: 20px; }
        .empty-state h3 { color: white; font-size: 20px; margin-bottom: 10px; }
        .empty-state p { color: #6b7a99; font-size: 12px; margin-bottom: 25px; }
        @media (max-width: 768px) {
            .podium { flex-direction: column; align-items: center; }
            .podium-player.winner { order: 1; transform: none; }
            .podium-player.runner { order: 2; }
            .score-divider { order: 3; margin-top: 10px; }
            .rewards-section { grid-template-columns: 1fr; }
            .results-title { font-size: 28px; }
            .result-actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div id="component-spinner"></div>

    <div class="results-view">
        <div class="confetti c1"></div>
        <div class="confetti c2"></div>
        <div class="confetti c3"></div>
        <div class="confetti c4"></div>
        <div class="confetti c5"></div>
        <div class="confetti c6"></div>

        <div class="results-content" id="game-results-container">
            <div class="empty-state">
                <i class="fa fa-trophy"></i>
                <h3 data-i18n="game.noResults">No match results yet</h3>
                <p data-i18n="game.noResultsDesc">Complete a match to see your results here.</p>
                <a href="game-setup.html" class="btn-primary-cta" style="text-decoration:none;" data-i18n="game.playAgain">
                    <span>Play Again</span> <i class="fa fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/game-state.js"></script>
    <script>
        IremeComponents.initPage('game-result.html', ['js/game-state.js']);

        var originalShowResults = IremeGameUI.showResults;
        IremeGameUI.showResults = function(record, resultText) {
            var lang = localStorage.getItem('ireme-lang') || 'en';
            var container = document.getElementById('game-results-container');
            if (!container) return;

            var isWin = record.result === 'win';
            var isDraw = record.result === 'draw';
            var titleClass = isWin ? 'win' : isDraw ? 'draw' : 'loss';
            var titleText = isWin
                ? (lang === 'rw' ? 'Watsinze!' : 'Victory!')
                : isDraw
                    ? (lang === 'rw' ? 'Manganye!' : "It's a Draw!")
                    : (lang === 'rw' ? 'Watsinzwe' : 'Defeat');

            var user = null;
            if (typeof IremeAuth !== 'undefined' && IremeAuth.getCurrentUser) {
                user = IremeAuth.getCurrentUser();
            }
            var playerName = user ? user.fullName : 'You';
            var playerInitials = playerName.split(' ').map(function(n) { return n[0]; }).join('').slice(0, 2).toUpperCase();
            var oppName = record.opponent || 'Opponent';
            var oppInitials = oppName.split('_').map(function(n) { return n[0]; }).join('').slice(0, 2).toUpperCase() || 'OP';

            var xpEarned = isWin ? 120 : isDraw ? 60 : 30;
            var subjectLabel = (record.subject || 'N/A').toUpperCase();

            var subtitleText = isWin
                ? (lang === 'rw' ? 'Ubwenge bwawe bw\'imibare bwagufashe gutsinda.' : 'Your quick thinking and strong skills secured the win.')
                : isDraw
                    ? (lang === 'rw' ? 'Umukino mwiza! Mwese mwakinnye neza.' : 'Great match! Both of you played well.')
                    : (lang === 'rw' ? 'Gerageza nanone, uzatsinda!' : 'Keep practicing, you\'ll get there!');

            var feedbackItems = [
                lang === 'rw' ? 'Komeza kwitoza ibibazo by\'iki gice kugira ngo urusheho kumenya' : 'Keep practicing questions in this topic to improve mastery',
                lang === 'rw' ? 'Soma ibitabo by\'iki gice muri REB curriculum' : 'Review curriculum materials for this subject area',
                lang === 'rw' ? 'Koresha Ireme AI kugira ngo ubaze ibibazo bigoye' : 'Use Ireme AI to ask questions about difficult topics'
            ];

            if (isWin) {
                feedbackItems.unshift(lang === 'rw' ? 'Witwaye neza cyane! Komeza uko' : 'Excellent performance! Keep up the momentum');
            } else if (!isDraw) {
                feedbackItems.unshift(lang === 'rw' ? 'Gerageza gusubiramo ibyo wibeshyeho' : 'Focus on reviewing the topics you missed');
            }

            container.innerHTML = '<span class="result-eyebrow"><i class="fa fa-trophy"></i> ' + (lang === 'rw' ? 'UMUKINO URANGIYE' : 'BATTLE COMPLETE') + '</span>' +
                '<h1 class="results-title ' + titleClass + '">' + titleText + ', ' + playerName.split(' ')[0] + '!</h1>' +
                '<p class="results-subtitle">' + subtitleText + '</p>' +

                '<div class="podium">' +
                    '<div class="podium-player ' + (isWin ? 'winner' : 'runner') + '">' +
                        (isWin ? '<div class="crown"><i class="fa fa-trophy"></i></div>' : '') +
                        '<div class="p-avatar">' + playerInitials + '</div>' +
                        '<h3>' + playerName + '</h3>' +
                        '<span class="result-label">' + (isWin ? (lang === 'rw' ? 'INTSINZI' : 'WINNER') : isDraw ? (lang === 'rw' ? 'MANGANYE' : 'DRAW') : (lang === 'rw' ? 'UWATSINTSWE' : 'RUNNER-UP')) + '</span>' +
                        '<div class="final-score">' + record.playerScore + '</div>' +
                        '<div class="accuracy-text">' + record.accuracy + '% ' + (lang === 'rw' ? 'ukuri' : 'accuracy') + '</div>' +
                    '</div>' +
                    '<div class="score-divider">' +
                        '<span class="final-score-big">' + record.playerScore + ' – ' + record.opponentScore + '</span>' +
                        '<small>' + (lang === 'rw' ? 'AMANOTA YA NYUMA' : 'FINAL SCORE') + '</small>' +
                    '</div>' +
                    '<div class="podium-player ' + (isWin ? 'runner' : 'winner') + '">' +
                        (!isWin && !isDraw ? '<div class="crown"><i class="fa fa-trophy"></i></div>' : '') +
                        '<div class="p-avatar">' + oppInitials + '</div>' +
                        '<h3>' + oppName.replace('_', ' ') + '</h3>' +
                        '<span class="result-label">' + (!isWin && !isDraw ? (lang === 'rw' ? 'INTSINZI' : 'WINNER') : (lang === 'rw' ? 'UWATSINTSWE' : 'RUNNER-UP')) + '</span>' +
                        '<div class="final-score">' + record.opponentScore + '</div>' +
                        '<div class="accuracy-text">' + (100 - record.accuracy > 0 ? Math.round(record.accuracy * 0.85) : record.accuracy) + '% ' + (lang === 'rw' ? 'ukuri' : 'accuracy') + '</div>' +
                    '</div>' +
                '</div>' +

                '<div class="rewards-section">' +
                    '<div class="reward-card">' +
                        '<div class="reward-icon xp"><i class="fa fa-star"></i></div>' +
                        '<div class="reward-value">+' + xpEarned + '</div>' +
                        '<div class="reward-label">XP ' + (lang === 'rw' ? 'Ubumenyi' : 'Earned') + '</div>' +
                    '</div>' +
                    '<div class="reward-card">' +
                        '<div class="reward-icon acc"><i class="fa fa-bullseye"></i></div>' +
                        '<div class="reward-value">' + record.accuracy + '%</div>' +
                        '<div class="reward-label">' + (lang === 'rw' ? 'Ukuri' : 'Accuracy') + '</div>' +
                    '</div>' +
                    '<div class="reward-card">' +
                        '<div class="reward-icon streak"><i class="fa fa-fire"></i></div>' +
                        '<div class="reward-value">' + subjectLabel + '</div>' +
                        '<div class="reward-label">' + (lang === 'rw' ? 'Isomo' : 'Subject') + '</div>' +
                    '</div>' +
                '</div>' +

                '<div class="ai-feedback">' +
                    '<div class="ai-feedback-header">' +
                        '<span class="ai-chip"><i class="fa fa-robot"></i> IREME AI</span>' +
                        '<h4>' + (lang === 'rw' ? 'Inama zo kwiga' : 'Learning Recommendations') + '</h4>' +
                    '</div>' +
                    '<ul>' +
                        feedbackItems.map(function(item) {
                            return '<li><i class="fa fa-check-circle"></i> <span>' + item + '</span></li>';
                        }).join('') +
                    '</ul>' +
                '</div>' +

                '<div class="result-actions">' +
                    '<a href="game-setup.html" class="btn-primary-cta"><span>' + (lang === 'rw' ? 'Subira Ukinire' : 'Play Again') + '</span> <i class="fa fa-arrow-right"></i></a>' +
                    '<a href="game-setup.html" class="btn-secondary-cta"><i class="fa fa-exchange-alt"></i> ' + (lang === 'rw' ? 'Hindura Isomo' : 'Change Subject') + '</a>' +
                    '<a href="' + (user && user.role === 'student' ? 'student-dashboard.html' : 'index.html') + '" class="btn-secondary-cta"><i class="fa fa-home"></i> ' + (lang === 'rw' ? 'Subira ahabanza' : 'Dashboard') + '</a>' +
                '</div>';

            setTimeout(function() { window.location.href = 'game-result.html'; }, 100);
        };

        setTimeout(function() {
            if (typeof IremeGame !== 'undefined' && IremeGame.state.phase === 'completed') {
                var record = {
                    date: new Date().toLocaleDateString(),
                    subject: IremeGame.state.subject,
                    level: IremeGame.state.level,
                    opponent: IremeGame.state.opponent ? IremeGame.state.opponent.name : 'Opponent',
                    playerScore: IremeGame.state.playerScore,
                    opponentScore: IremeGame.state.opponentScore,
                    result: IremeGame.state.playerScore > IremeGame.state.opponentScore ? 'win' : IremeGame.state.playerScore === IremeGame.state.opponentScore ? 'draw' : 'loss',
                    accuracy: Math.round((IremeGame.state.playerScore / (IremeGame.state.totalRounds * 3)) * 100)
                };
                var lang = localStorage.getItem('ireme-lang') || 'en';
                var resultText = record.result === 'win' ? (lang === 'rw' ? 'Watsinze!' : 'Victory!') : record.result === 'draw' ? (lang === 'rw' ? 'Manganye!' : "It's a Draw!") : (lang === 'rw' ? 'Watsinzwe' : 'Defeat');
                IremeGameUI.showResults(record, resultText);
            }
        }, 300);
    </script>
</body>
</html>
