<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Teaching Jobs</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .job-card { transition: all 0.3s; }
        .job-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="teacherJobs.title">Available Teaching Jobs</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="teacherJobs.title">Teaching Jobs</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid bg-light py-4">
        <div class="container py-3">
            <div class="row g-3">
                <div class="col-md-5">
                    <input type="text" id="job-search" class="form-control rounded-pill px-4 py-2" data-i18n="teacherJobs.search" placeholder="Search jobs...">
                </div>
                <div class="col-md-4">
                    <select id="job-type" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="teacherJobs.allTypes">All Types</option>
                        <option value="full-time" data-i18n="teacherJobs.fullTime">Full Time</option>
                        <option value="part-time" data-i18n="teacherJobs.partTime">Part Time</option>
                        <option value="contract" data-i18n="teacherJobs.contract">Contract</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="job-location" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="teacherJobs.allLocations">All Locations</option>
                        <option value="Kigali">Kigali</option>
                        <option value="Eastern">Eastern</option>
                        <option value="Western">Western</option>
                        <option value="Northern">Northern</option>
                        <option value="Southern">Southern</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="container-xxl py-5">
        <div class="container">
            <div id="jobs-list" class="row g-4"></div>
            <div id="jobs-empty" class="text-center py-5" style="display:none;">
                <i class="fa fa-briefcase fa-3x text-muted mb-3"></i>
                <h4 data-i18n="teacherJobs.noJobs">No jobs available</h4>
                <p class="text-muted" data-i18n="teacherJobs.noJobsDesc">Check back later for new teaching positions</p>
            </div>
        </div>
    </div>

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('teacher-jobs.html');
        IremeAuth.requireRole('teacher');

        function loadJobs() {
            var params = {
                search: document.getElementById('job-search').value,
                type: document.getElementById('job-type').value,
                location: document.getElementById('job-location').value
            };
            IremeAPI.getTeacherJobs(params).then(function(data) {
                displayJobs(data.jobs || []);
            }).catch(function() { displayJobs([]); });
        }

        function displayJobs(jobs) {
            var container = document.getElementById('jobs-list');
            var empty = document.getElementById('jobs-empty');
            if (jobs.length === 0) { container.innerHTML = ''; empty.style.display = 'block'; return; }
            empty.style.display = 'none';
            container.innerHTML = jobs.map(function(j) {
                var typeColor = j.type === 'full-time' ? 'bg-primary' : j.type === 'part-time' ? 'bg-info' : 'bg-warning text-dark';
                var deadline = j.applicationDeadline ? new Date(j.applicationDeadline).toLocaleDateString() : '';
                var posted = j.createdAt ? new Date(j.createdAt).toLocaleDateString() : '';
                return '<div class="col-md-6 col-lg-4"><div class="job-card bg-white rounded shadow-sm p-4 h-100">' +
                    '<div class="d-flex align-items-start mb-3">' +
                    '<div class="flex-shrink-0 bg-light rounded-circle d-flex align-items-center justify-content-center" style="width:48px;height:48px;"><i class="fa fa-school text-primary"></i></div>' +
                    '<div class="ms-3"><h5 class="mb-0">' + (j.title || 'Teaching Position') + '</h5>' +
                    '<small class="text-muted">' + (j.schoolName || '') + '</small></div></div>' +
                    '<div class="mb-2"><span class="badge ' + typeColor + ' me-1">' + (j.type || 'Full Time') + '</span>' +
                    '<span class="badge bg-light text-dark"><i class="fa fa-map-marker-alt me-1"></i>' + (j.district || j.location || '') + '</span></div>' +
                    '<p class="small text-muted mb-2">' + (j.description || '').substring(0, 100) + '</p>' +
                    '<div class="d-flex justify-content-between align-items-center">' +
                    '<small class="text-muted"><i class="fa fa-clock me-1"></i>' + posted + '</small>' +
                    '<a href="#" class="btn btn-sm btn-primary rounded-pill px-3" data-i18n="teacherJobs.apply">Apply Now</a>' +
                    '</div></div></div>';
            }).join('');
        }

        document.getElementById('job-search').addEventListener('input', loadJobs);
        document.getElementById('job-type').addEventListener('change', loadJobs);
        document.getElementById('job-location').addEventListener('change', loadJobs);
        loadJobs();
    </script>
</body>
</html>
