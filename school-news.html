<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - School News</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .news-card { transition: all 0.3s; }
        .news-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .news-card.featured { border-left: 4px solid var(--primary); }
    </style>
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="schoolNews.title">School News & Announcements</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="schoolNews.title">School News</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Content Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <!-- Filter Tabs -->
            <div class="d-flex gap-2 mb-4 flex-wrap">
                <button class="btn btn-primary rounded-pill px-4 py-2 active" data-filter="all">All</button>
                <button class="btn btn-outline-primary rounded-pill px-4 py-2" data-filter="important" data-i18n="schoolNews.important">Important</button>
                <button class="btn btn-outline-primary rounded-pill px-4 py-2" data-filter="academic" data-i18n="schoolNews.academic">Academic</button>
                <button class="btn btn-outline-primary rounded-pill px-4 py-2" data-filter="events" data-i18n="schoolNews.events">Events</button>
                <button class="btn btn-outline-primary rounded-pill px-4 py-2" data-filter="general" data-i18n="schoolNews.general">General</button>
            </div>

            <!-- News List -->
            <div id="news-list">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>

            <!-- Empty State -->
            <div id="news-empty" class="text-center py-5" style="display:none">
                <i class="fa fa-newspaper fa-3x text-muted mb-3"></i>
                <h4 data-i18n="schoolNews.noNews">No news available</h4>
            </div>
        </div>
    </div>
    <!-- Content End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        IremeComponents.initPage('school-news.html');
        IremeAuth.requireAuth();

        var allNews = [];
        var currentFilter = 'all';

        var categoryColors = {
            important: 'bg-danger',
            academic: 'bg-primary',
            events: 'bg-success',
            general: 'bg-secondary'
        };

        function loadNews() {
            IremeAPI.getSchoolNews().then(function(data) {
                allNews = data.news || data.events || [];
                allNews.sort(function(a, b) { return new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date); });
                filterAndDisplay();
            }).catch(function(err) {
                console.error('Failed to load news:', err);
                document.getElementById('news-list').innerHTML = '';
                document.getElementById('news-empty').style.display = 'block';
            });
        }

        function filterAndDisplay() {
            var filtered = currentFilter === 'all' ? allNews : allNews.filter(function(n) {
                return (n.category || n.type || 'general').toLowerCase() === currentFilter;
            });

            var container = document.getElementById('news-list');
            var emptyState = document.getElementById('news-empty');

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = filtered.map(function(n) {
                var category = (n.category || n.type || 'general').toLowerCase();
                var color = categoryColors[category] || 'bg-secondary';
                var isFeatured = n.important || n.featured;
                var date = new Date(n.createdAt || n.date || n.publishedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

                return '<div class="news-card ' + (isFeatured ? 'featured ' : '') + 'bg-white rounded shadow-sm p-4 mb-3">' +
                    '<div class="d-flex justify-content-between align-items-start mb-2">' +
                    '<div>' +
                    '<span class="badge ' + color + ' mb-2">' + (category.charAt(0).toUpperCase() + category.slice(1)) + '</span>' +
                    (isFeatured ? '<span class="badge bg-warning text-dark mb-2 ms-1"><i class="fa fa-star me-1"></i>Important</span>' : '') +
                    '<h5 class="mb-1">' + (n.title || 'Announcement') + '</h5>' +
                    '</div>' +
                    '<small class="text-muted text-nowrap">' + date + '</small>' +
                    '</div>' +
                    '<p class="text-muted mb-2">' + (n.content || n.description || n.body || '') + '</p>' +
                    (n.author || n.postedBy ? '<small class="text-muted"><i class="fa fa-user me-1"></i>' + IremeI18n.t('schoolNews.postedBy') + ' ' + (n.author || n.postedBy) + '</small>' : '') +
                    '</div>';
            }).join('');
        }

        document.querySelectorAll('[data-filter]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-filter]').forEach(function(b) {
                    b.classList.remove('active', 'btn-primary');
                    b.classList.add('btn-outline-primary');
                });
                this.classList.add('active', 'btn-primary');
                this.classList.remove('btn-outline-primary');
                currentFilter = this.dataset.filter;
                filterAndDisplay();
            });
        });

        loadNews();
    </script>
</body>
</html>
