<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>IREME - National Exam Papers</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="IREME National Exams, NESA, Rwanda, Past Papers, National Examination" name="keywords">
    <meta content="Access authentic past national examination papers from NESA with marking guides for self-assessment." name="description">

    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        .paper-card { transition: all 0.3s; }
        .paper-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .official-badge { background: linear-gradient(135deg, #1364dc, #0d47a1); }
    </style>
</head>

<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="nationalExams.title">National Exam Papers</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="nationalExams.title">National Exams</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Filters Start -->
    <div class="container-fluid bg-light py-4">
        <div class="container py-3">
            <div class="row g-3">
                <div class="col-md-4">
                    <select id="nesa-level" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="quizzes.selectLevel">Select Level</option>
                        <option value="S6">S6 (Advanced Level)</option>
                        <option value="S3">S3 (Ordinary Level)</option>
                        <option value="P6">P6 (Primary)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="nesa-subject" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="quizzes.selectSubject">Select Subject</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="nesa-year" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="nationalExams.allYears">All Years</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <!-- Filters End -->

    <!-- Disclaimer -->
    <div class="container-xxl pt-4">
        <div class="container">
            <div class="alert alert-info border-0 rounded-3 d-flex align-items-center" role="alert">
                <i class="fa fa-info-circle fa-lg text-primary me-3"></i>
                <div>
                    <strong data-i18n="nationalExams.official">Official NESA Papers</strong>
                    <p class="mb-0 small text-muted mt-1" data-i18n="nationalExams.disclaimer">These are authentic national examination papers. Marking guides are provided for self-assessment.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Papers List Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <div id="papers-list" class="row g-4">
                <!-- Papers loaded here -->
            </div>

            <div id="papers-empty" class="text-center py-5" style="display: none;">
                <i class="fa fa-file-alt fa-3x text-muted mb-3"></i>
                <h4 data-i18n="nationalExams.noPapers">No exam papers available</h4>
                <p class="text-muted" data-i18n="nationalExams.noPapersDesc">Exam papers will be added as they become available from official sources</p>
            </div>
        </div>
    </div>
    <!-- Papers List End -->

    <div id="component-footer"></div>

    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        IremeComponents.initPage('national-exams.html');

        function populateYears() {
            var select = document.getElementById('nesa-year');
            var currentYear = new Date().getFullYear();
            for (var y = currentYear; y >= 2015; y--) {
                var option = document.createElement('option');
                option.value = y;
                option.textContent = y;
                select.appendChild(option);
            }
        }

        function loadSubjects() {
            IremeAPI.getCurriculumSubjects().then(function(data) {
                var subjects = data.subjects || [];
                var select = document.getElementById('nesa-subject');
                subjects.forEach(function(subject) {
                    var option = document.createElement('option');
                    option.value = subject.id;
                    option.textContent = subject.name || subject.nameEn;
                    select.appendChild(option);
                });
            });
        }

        function loadPapers() {
            var level = document.getElementById('nesa-level').value;
            var subject = document.getElementById('nesa-subject').value;
            var year = document.getElementById('nesa-year').value;

            var params = {};
            if (level) params.level = level;
            if (subject) params.subjectId = subject;
            if (year) params.year = year;

            IremeAPI.getNationalExams(params).then(function(data) {
                var papers = data.papers || data.exams || [];
                displayPapers(papers);
            }).catch(function(err) {
                console.error('Failed to load national exams:', err);
                displayPapers([]);
            });
        }

        function displayPapers(papers) {
            var container = document.getElementById('papers-list');
            var emptyState = document.getElementById('papers-empty');

            if (papers.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            var html = papers.map(function(paper) {
                var year = paper.year || '';
                var level = paper.level || paper.educationLevel || '';
                var subject = paper.subjectName || paper.subject || '';
                var hasMarkingGuide = paper.markingGuideUrl || paper.hasMarkingGuide;
                var paperUrl = paper.paperUrl || paper.documentUrl || '#';

                return '<div class="col-md-6 col-lg-4 wow fadeInUp" data-wow-delay="0.1s">' +
                    '<div class="paper-card bg-white rounded shadow-sm p-4 h-100">' +
                    '<div class="d-flex align-items-start mb-3">' +
                    '<div class="flex-shrink-0 official-badge rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">' +
                    '<i class="fa fa-award text-white"></i>' +
                    '</div>' +
                    '<div class="flex-grow-1 ms-3">' +
                    '<h5 class="mb-1">' + subject + '</h5>' +
                    '<span class="badge bg-primary rounded-pill">' + level + ' - ' + year + '</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="d-flex align-items-center mb-3">' +
                    '<span class="badge bg-success me-2"><i class="fa fa-check-circle me-1"></i> NESA</span>' +
                    '<small class="text-muted">' + (paper.type || 'National Examination') + '</small>' +
                    '</div>' +
                    '<div class="d-flex gap-2">' +
                    '<a href="' + paperUrl + '" target="_blank" rel="noopener" class="btn btn-sm btn-primary rounded-pill px-3">' +
                    '<i class="fa fa-eye me-1"></i> <span data-i18n="nationalExams.viewPaper">View Paper</span>' +
                    '</a>' +
                    (hasMarkingGuide ? '<a href="' + (paper.markingGuideUrl || '#') + '" target="_blank" rel="noopener" class="btn btn-sm btn-outline-primary rounded-pill px-3"><i class="fa fa-check-double me-1"></i> <span data-i18n="nationalExams.markingGuide">Marking Guide</span></a>' : '') +
                    '</div>' +
                    '</div>' +
                    '</div>';
            }).join('');

            container.innerHTML = html;
        }

        document.getElementById('nesa-level').addEventListener('change', loadPapers);
        document.getElementById('nesa-subject').addEventListener('change', loadPapers);
        document.getElementById('nesa-year').addEventListener('change', loadPapers);

        populateYears();
        loadSubjects();
        loadPapers();
    </script>
</body>

</html>
