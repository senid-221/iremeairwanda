<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME Game - Fighting by Questions</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        :root { --ireme-primary: #1363C6; --ireme-secondary: #15ACE1; --ireme-light: #F4F7FE; --ireme-dark: #14183E; --ireme-gold: #F4A926; --ireme-muted: #6B7A99; --ireme-line: #E5EAF4; --ireme-green: #12B981; }
        body { background: radial-gradient(ellipse at top, #1a2a5e, #0d1633 70%, #080e24); min-height: 100vh; }
        #component-navbar { display: none; }
        #component-footer { display: none; }
        #component-backtotop { display: none; }
        .game-view { min-height: 100vh; display: flex; flex-direction: column; padding: 0; }
        .game-top-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 30px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.06); }
        .game-top-bar .game-logo { display: flex; align-items: center; gap: 10px; color: white; }
        .game-top-bar .game-logo .logo-mark { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(145deg, #ffd75b, #ffb800); display: grid; place-items: center; color: var(--ireme-dark); font-weight: 900; font-size: 20px; transform: rotate(-5deg); box-shadow: 0 6px 16px rgba(0,0,0,0.3); }
        .game-top-bar .game-logo .logo-mark span { transform: rotate(5deg); }
        .game-top-bar .game-logo strong { display: block; letter-spacing: 2px; font-size: 15px; }
        .game-top-bar .game-logo small { display: block; font-size: 6px; letter-spacing: 1px; color: #788db8; }
        .round-chip { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #c1ceea; padding: 6px 14px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
        .round-chip b { color: white; font-size: 13px; margin: 0 3px; }
        .btn-leave { border: 1px solid rgba(255,100,100,0.3); background: rgba(255,100,100,0.1); color: #ff8a8a; padding: 7px 14px; border-radius: 9px; font-size: 9px; font-weight: 700; cursor: pointer; transition: .2s; }
        .btn-leave:hover { background: rgba(255,100,100,0.2); }
        .match-progress { height: 4px; background: rgba(255,255,255,0.06); }
        .match-progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--ireme-secondary), var(--ireme-gold)); border-radius: 9px; transition: width .5s; }
        .players-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 20px 30px; gap: 15px; }
        .player-card { display: flex; align-items: center; gap: 12px; }
        .player-card.right { flex-direction: row-reverse; text-align: right; }
        .player-avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: white; border: 3px solid rgba(255,255,255,0.3); flex: none; }
        .player-avatar.p1 { background: linear-gradient(145deg, var(--ireme-primary), #0d4a9c); }
        .player-avatar.p2 { background: linear-gradient(145deg, #8f67f5, #4c2bb8); }
        .player-info { flex: 1; }
        .player-info .player-label { font-size: 7px; letter-spacing: 1px; color: #788db8; font-weight: 700; text-transform: uppercase; }
        .player-info .player-name { font-size: 14px; font-weight: 700; color: white; margin: 2px 0; }
        .player-health { height: 5px; background: rgba(255,255,255,0.1); border-radius: 9px; overflow: hidden; margin-top: 4px; }
        .player-health i { display: block; height: 100%; background: linear-gradient(90deg, var(--ireme-green), #4ed49e); border-radius: 9px; transition: width .5s; }
        .player-score { font-size: 22px; font-weight: 800; color: white; min-width: 40px; }
        .player-card.right .player-score { text-align: left; }
        .center-vs { width: 50px; height: 50px; border-radius: 50%; background: var(--ireme-gold); color: var(--ireme-dark); display: grid; place-items: center; font-size: 16px; font-weight: 900; box-shadow: 0 0 0 8px rgba(244,169,38,0.15), 0 0 0 16px rgba(244,169,38,0.07); }
        .center-vs small { display: block; font-size: 6px; font-weight: 700; color: #7a6020; letter-spacing: 0.5px; }
        .question-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 30px 30px; max-width: 800px; margin: 0 auto; width: 100%; }
        .timer-circle { position: relative; width: 70px; height: 70px; margin-bottom: 15px; }
        .timer-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .timer-circle .timer-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 3; }
        .timer-circle .timer-fg { fill: none; stroke: var(--ireme-secondary); stroke-width: 3; stroke-linecap: round; transition: stroke-dasharray .3s, stroke .3s; }
        .timer-circle.urgent .timer-fg { stroke: #ff6b6b; }
        .timer-circle b { position: absolute; inset: 0; display: grid; place-items: center; color: white; font-size: 20px; font-weight: 800; }
        .timer-circle.urgent b { color: #ff6b6b; animation: timerPulse 1s infinite; }
        @keyframes timerPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .question-meta { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 10px; }
        .question-meta .topic-badge { font-size: 8px; letter-spacing: 1px; color: var(--ireme-secondary); font-weight: 800; text-transform: uppercase; background: rgba(21,172,225,0.1); padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(21,172,225,0.2); }
        .question-meta .streak-badge { font-size: 9px; color: var(--ireme-gold); font-weight: 700; display: flex; align-items: center; gap: 5px; }
        .question-text { color: white; font-size: 22px; font-weight: 700; text-align: center; margin: 15px 0 25px; line-height: 1.4; letter-spacing: -0.5px; }
        .question-text em { font-style: normal; color: var(--ireme-gold); }
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .answer-btn { border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: white; border-radius: 13px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: .2s; text-align: left; }
        .answer-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--ireme-secondary); transform: translateY(-2px); }
        .answer-btn .answer-letter { width: 32px; height: 32px; border-radius: 9px; background: rgba(255,255,255,0.08); display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--ireme-secondary); flex: none; }
        .answer-btn .answer-text { font-size: 13px; font-weight: 600; flex: 1; }
        .answer-btn.correct { background: rgba(18,185,129,0.15); border-color: var(--ireme-green); }
        .answer-btn.correct .answer-letter { background: var(--ireme-green); color: white; }
        .answer-btn.incorrect { background: rgba(255,100,100,0.1); border-color: #ff6b6b; opacity: 0.7; }
        .answer-btn.incorrect .answer-letter { background: #ff6b6b; color: white; }
        .answer-btn.disabled { pointer-events: none; opacity: 0.5; }
        .answer-btn .answer-check { color: var(--ireme-green); font-size: 16px; display: none; }
        .answer-btn.correct .answer-check { display: block; }
        .explanation-panel { width: 100%; margin-top: 18px; background: rgba(18,185,129,0.08); border: 1px solid rgba(18,185,129,0.2); border-radius: 13px; padding: 16px 20px; display: flex; align-items: flex-start; gap: 14px; animation: slideUp .3s ease; }
        .explanation-panel.wrong { background: rgba(255,100,100,0.08); border-color: rgba(255,100,100,0.2); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .explanation-panel .exp-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; font-size: 16px; }
        .explanation-panel .exp-icon.correct { background: rgba(18,185,129,0.2); color: var(--ireme-green); }
        .explanation-panel .exp-icon.wrong { background: rgba(255,100,100,0.2); color: #ff6b6b; }
        .explanation-panel strong { display: block; color: white; font-size: 12px; margin-bottom: 4px; }
        .explanation-panel p { color: #9eb1da; font-size: 10px; line-height: 1.6; margin: 0; }
        .game-footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 30px; background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.06); }
        .game-footer span { font-size: 9px; color: #6b7a99; display: flex; align-items: center; gap: 6px; }
        .turn-indicator { text-align: center; margin-bottom: 8px; }
        .turn-indicator span { font-size: 9px; font-weight: 800; letter-spacing: 1px; padding: 5px 12px; border-radius: 7px; text-transform: uppercase; }
        .turn-indicator span.your-turn { background: rgba(19,99,198,0.2); color: var(--ireme-secondary); border: 1px solid rgba(21,172,225,0.3); }
        .turn-indicator span.opp-turn { background: rgba(255,255,255,0.05); color: #788db8; border: 1px solid rgba(255,255,255,0.08); }
        @media (max-width: 768px) {
            .answers-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 17px; }
            .players-bar { padding: 15px; gap: 8px; }
            .player-score { font-size: 18px; }
            .center-vs { width: 40px; height: 40px; font-size: 13px; }
            .game-top-bar { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <div id="component-spinner"></div>

    <div class="game-view">
        <div class="game-top-bar">
            <div class="game-logo">
                <div class="logo-mark"><span>I</span></div>
                <div><strong>IREME</strong><small>FIGHTING BY QUESTIONS</small></div>
            </div>
            <span class="round-chip" data-i18n="game.roundLabel">ROUND <b id="game-round-num">1</b> OF <b id="game-total-rounds">10</b></span>
            <button class="btn-leave" onclick="leaveMatch()" data-i18n="game.leaveMatch">Leave match</button>
        </div>

        <div class="match-progress"><i id="match-progress-bar" style="width: 10%"></i></div>

        <div class="players-bar">
            <div class="player-card left">
                <div class="player-avatar p1" id="p1-avatar">KM</div>
                <div class="player-info">
                    <span class="player-label" id="p1-label">YOU · GOLD IV</span>
                    <strong class="player-name" id="p1-name">Keza M.</strong>
                    <div class="player-health"><i id="p1-health" style="width: 100%"></i></div>
                </div>
                <span class="player-score" id="p1-score">0</span>
            </div>
            <div class="center-vs">
                VS
            </div>
            <div class="player-card right">
                <div class="player-avatar p2" id="p2-avatar">OP</div>
                <div class="player-info">
                    <span class="player-label" id="p2-label">OPPONENT</span>
                    <strong class="player-name" id="p2-name">Opponent</strong>
                    <div class="player-health"><i id="p2-health" style="width: 100%"></i></div>
                </div>
                <span class="player-score" id="p2-score">0</span>
            </div>
        </div>

        <main class="question-area">
            <div class="timer-circle" id="timer-circle">
                <svg viewBox="0 0 44 44">
                    <circle class="timer-bg" cx="22" cy="22" r="19"/>
                    <circle class="timer-fg" id="timer-arc" cx="22" cy="22" r="19" stroke-dasharray="119 119"/>
                </svg>
                <b id="game-timer">30</b>
            </div>

            <div class="turn-indicator" id="game-turn-indicator">
                <span class="your-turn" data-i18n="game.yourTurn">YOUR TURN</span>
            </div>

            <div class="question-meta">
                <span class="topic-badge" id="game-topic">TOPIC</span>
                <span class="streak-badge" id="game-streak"><i class="fa fa-fire"></i> <span data-i18n="game.streak">0 streak</span></span>
            </div>

            <h1 class="question-text" id="game-question-text">Question will appear here...</h1>

            <div class="answers-grid" id="game-options"></div>

            <div id="game-result-feedback"></div>
        </main>

        <footer class="game-footer">
            <span><i class="fa fa-shield-alt"></i> <span data-i18n="game.secureNote">Answers validated securely by IREME</span></span>
            <span id="game-difficulty-badge">Medium</span>
        </footer>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/game-state.js"></script>
    <script>
        IremeComponents.initPage('game-match.html', ['js/game-state.js']);

        var answerStreak = 0;

        function leaveMatch() {
            if (confirm('Leave this match? Your progress will be lost.')) {
                IremeGame.cancelMatchmaking();
                window.location.href = 'game-setup.html';
            }
        }

        var originalUpdateUI = IremeGame.updateGameUI.bind(IremeGame);
        IremeGame.updateGameUI = function() {
            var q = this.state.currentQuestion;
            if (!q) return;
            var lang = localStorage.getItem('ireme-lang') || 'en';

            var roundEl = document.getElementById('game-round-num');
            if (roundEl) roundEl.textContent = this.state.currentRound;
            var totalEl = document.getElementById('game-total-rounds');
            if (totalEl) totalEl.textContent = this.state.totalRounds;

            var progressPct = (this.state.currentRound / this.state.totalRounds) * 100;
            var progressBar = document.getElementById('match-progress-bar');
            if (progressBar) progressBar.style.width = progressPct + '%';

            var topicEl = document.getElementById('game-topic');
            if (topicEl) topicEl.textContent = q.topic.toUpperCase();

            var diffEl = document.getElementById('game-difficulty-badge');
            if (diffEl) {
                var diffText = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
                diffEl.textContent = diffText[q.difficulty] || q.difficulty;
            }

            var questionEl = document.getElementById('game-question-text');
            if (questionEl) {
                var qText = lang === 'rw' ? q.text_rw : q.text_en;
                questionEl.innerHTML = qText.replace(/(\d+[\+\-\×\÷\=x][\d\+\-\×\÷\=\sx]+)/gi, '<em>$1</em>');
            }

            var optionsEl = document.getElementById('game-options');
            if (optionsEl) {
                var options = lang === 'rw' ? q.options_rw : q.options_en;
                optionsEl.innerHTML = options.map(function(opt, i) {
                    return '<button class="answer-btn" onclick="selectAnswer(' + i + ')" id="answer-' + i + '">' +
                        '<span class="answer-letter">' + String.fromCharCode(65 + i) + '</span>' +
                        '<span class="answer-text">' + opt + '</span>' +
                        '<i class="fa fa-check answer-check"></i>' +
                        '</button>';
                }).join('');
                if (!this.state.playerTurn) {
                    optionsEl.querySelectorAll('.answer-btn').forEach(function(btn) { btn.classList.add('disabled'); });
                }
            }

            var turnEl = document.getElementById('game-turn-indicator');
            if (turnEl) {
                if (this.state.playerTurn) {
                    turnEl.innerHTML = '<span class="your-turn">' + (lang === 'rw' ? 'NI UKWAWE' : 'YOUR TURN') + '</span>';
                } else {
                    turnEl.innerHTML = '<span class="opp-turn">' + (lang === 'rw' ? 'UMUKINNYI ARIHITAMO...' : 'OPPONENT IS CHOOSING...') + '</span>';
                }
            }

            var streakEl = document.getElementById('game-streak');
            if (streakEl) {
                streakEl.innerHTML = '<i class="fa fa-fire"></i> ' + answerStreak + (lang === 'rw' ? ' ibisubizo bikurikirana' : ' answer streak');
            }

            document.getElementById('p1-score').textContent = this.state.playerScore;
            document.getElementById('p2-score').textContent = this.state.opponentScore;

            var maxScore = Math.max(this.state.playerScore + this.state.opponentScore, 1);
            var p1Pct = Math.max(20, (this.state.playerScore / (this.state.totalRounds * 3)) * 100);
            var p2Pct = Math.max(20, (this.state.opponentScore / (this.state.totalRounds * 3)) * 100);
            document.getElementById('p1-health').style.width = Math.min(100, p1Pct) + '%';
            document.getElementById('p2-health').style.width = Math.min(100, p2Pct) + '%';

            var user = null;
            if (typeof IremeAuth !== 'undefined' && IremeAuth.getCurrentUser) {
                user = IremeAuth.getCurrentUser();
            }
            if (user) {
                var initials = user.fullName.split(' ').map(function(n) { return n[0]; }).join('').slice(0, 2).toUpperCase();
                document.getElementById('p1-avatar').textContent = initials;
                document.getElementById('p1-name').textContent = user.fullName;
            }
            if (this.state.opponent) {
                var oppInitials = this.state.opponent.name.split('_').map(function(n) { return n[0]; }).join('').slice(0, 2).toUpperCase();
                document.getElementById('p2-avatar').textContent = oppInitials || 'OP';
                document.getElementById('p2-name').textContent = this.state.opponent.name.replace('_', ' ');
            }

            var feedbackEl = document.getElementById('game-result-feedback');
            if (feedbackEl) feedbackEl.innerHTML = '';

            var timerCircle = document.getElementById('timer-circle');
            if (timerCircle) timerCircle.classList.remove('urgent');
        };

        var originalStartTimer = IremeGame.startTimer.bind(IremeGame);
        IremeGame.startTimer = function() {
            clearInterval(this.state.timerInterval);
            var self = this;
            this.state.timerInterval = setInterval(function() {
                self.state.timer--;
                var timerEl = document.getElementById('game-timer');
                if (timerEl) timerEl.textContent = self.state.timer;

                var arc = document.getElementById('timer-arc');
                if (arc) {
                    var pct = self.state.timer / 30;
                    var dashLen = pct * 119;
                    arc.setAttribute('stroke-dasharray', dashLen + ' 119');
                }

                var timerCircle = document.getElementById('timer-circle');
                if (timerCircle) {
                    if (self.state.timer <= 8) {
                        timerCircle.classList.add('urgent');
                    } else {
                        timerCircle.classList.remove('urgent');
                    }
                }

                if (self.state.timer <= 0) {
                    clearInterval(self.state.timerInterval);
                    self.submitAnswer(-1);
                }
            }, 1000);
        };

        function selectAnswer(index) {
            if (!IremeGame.state.playerTurn) return;
            var btns = document.querySelectorAll('.answer-btn');
            btns.forEach(function(btn) { btn.classList.add('disabled'); });

            var q = IremeGame.state.currentQuestion;
            var isCorrect = index === q.correct;

            if (isCorrect) {
                document.getElementById('answer-' + index).classList.add('correct');
                answerStreak++;
            } else {
                document.getElementById('answer-' + index).classList.add('incorrect');
                document.getElementById('answer-' + q.correct).classList.add('correct');
                answerStreak = 0;
            }

            IremeGame.submitAnswer(index);
        }

        var originalShowResult = IremeGame.showAnswerResult.bind(IremeGame);
        IremeGame.showAnswerResult = function(isCorrect, isPlayerAnswering) {
            var q = this.state.currentQuestion;
            var lang = localStorage.getItem('ireme-lang') || 'en';
            var feedbackEl = document.getElementById('game-result-feedback');
            if (!feedbackEl) return;

            var options = lang === 'rw' ? q.options_rw : q.options_en;
            var explanation = lang === 'rw' ? q.explanation_rw : q.explanation_en;

            var points = isCorrect ? (q.difficulty === 'hard' ? 3 : q.difficulty === 'medium' ? 2 : 1) : 0;
            var titleText = isCorrect
                ? (lang === 'rw' ? 'Igisubizo nyacyo! +' + points + ' amanota' : 'Correct! +' + points + ' points')
                : (lang === 'rw' ? 'Igisubizo kitari cyo' : 'Incorrect');

            var iconClass = isCorrect ? 'correct' : 'wrong';
            var panelClass = isCorrect ? '' : ' wrong';
            var iconFa = isCorrect ? 'fa-check-circle' : 'fa-times-circle';

            feedbackEl.innerHTML = '<div class="explanation-panel' + panelClass + '">' +
                '<span class="exp-icon ' + iconClass + '"><i class="fa ' + iconFa + '"></i></span>' +
                '<div><strong>' + titleText + '</strong>' +
                '<p>' + explanation + '</p></div></div>';

            document.getElementById('p1-score').textContent = IremeGame.state.playerScore;
            document.getElementById('p2-score').textContent = IremeGame.state.opponentScore;

            setTimeout(function() {
                IremeGame.state.playerTurn = !IremeGame.state.playerTurn;
                IremeGame.nextRound();
            }, 4000);
        };

        setTimeout(function() {
            if (!IremeGame.state.currentQuestion) {
                window.location.href = 'game-setup.html';
                return;
            }
            IremeGame.updateGameUI();
        }, 500);
    </script>
</body>
</html>
