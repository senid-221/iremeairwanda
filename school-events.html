<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - School Events</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .event-card { transition: all 0.3s; }
        .event-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .event-date-badge { background: var(--primary); color: #fff; border-radius: 12px; padding: 10px 16px; text-align: center; min-width: 70px; }
        .event-date-badge .day { font-size: 24px; font-weight: 700; line-height: 1; }
        .event-date-badge .month { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="schoolEvents.title">School Events & Activities</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="schoolEvents.title">School Events</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Content Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4">
                <!-- Post Event Form -->
                <div class="col-lg-5 wow fadeInUp" data-wow-delay="0.1s">
                    <div class="bg-light rounded p-4">
                        <h4 class="mb-4"><i class="fa fa-calendar-plus text-primary me-2"></i><span data-i18n="schoolEvents.title">Post Event</span></h4>
                        <form id="event-form">
                            <div class="mb-3">
                                <label class="form-label fw-bold" data-i18n="schoolEvents.eventName">Event Name</label>
                                <input type="text" id="event-name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold" data-i18n="schoolEvents.eventType">Event Type</label>
                                <select id="event-type" class="form-select" required>
                                    <option value="SPORTS" data-i18n="schoolEvents.sports">Sports Day</option>
                                    <option value="ACADEMIC" data-i18n="schoolEvents.academic">Academic Competition</option>
                                    <option value="CULTURAL" data-i18n="schoolEvents.cultural">Cultural Day</option>
                                    <option value="OPEN_DAY" data-i18n="schoolEvents.openDay">Open Day</option>
                                    <option value="PRIZE_GIVING" data-i18n="schoolEvents.prizeGiving">Prize Giving</option>
                                    <option value="OTHER" data-i18n="schoolEvents.other">Other</option>
                                </select>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold" data-i18n="schoolEvents.date">Event Date</label>
                                    <input type="date" id="event-date" class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold" data-i18n="schoolEvents.time">Event Time</label>
                                    <input type="time" id="event-time" class="form-control">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold" data-i18n="schoolEvents.location">Location</label>
                                <input type="text" id="event-location" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold" data-i18n="schoolEvents.description">Description</label>
                                <textarea id="event-description" class="form-control" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3">
                                <i class="fa fa-paper-plane me-2"></i>
                                <span data-i18n="schoolEvents.submit">Post Event</span>
                            </button>
                        </form>
                        <div id="form-error" class="alert alert-danger mt-3" style="display:none"></div>
                        <div id="form-success" class="alert alert-success mt-3" style="display:none"></div>
                    </div>
                </div>

                <!-- Events List -->
                <div class="col-lg-7 wow fadeInUp" data-wow-delay="0.3s">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="mb-0" data-i18n="schoolEvents.upcoming">Upcoming Events</h4>
                    </div>
                    <div id="events-list">
                        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
                    </div>
                    <div id="events-empty" class="text-center py-5" style="display:none">
                        <i class="fa fa-calendar-times fa-3x text-muted mb-3"></i>
                        <h4 data-i18n="schoolEvents.noEvents">No events posted yet</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Content End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('school-events.html');
        IremeAuth.requireAuth();

        var typeIcons = {
            SPORTS: 'fa-running',
            ACADEMIC: 'fa-graduation-cap',
            CULTURAL: 'fa-music',
            OPEN_DAY: 'fa-door-open',
            PRIZE_GIVING: 'fa-trophy',
            OTHER: 'fa-calendar'
        };

        var typeColors = {
            SPORTS: 'bg-success',
            ACADEMIC: 'bg-primary',
            CULTURAL: 'bg-warning',
            OPEN_DAY: 'bg-info',
            PRIZE_GIVING: 'bg-danger',
            OTHER: 'bg-secondary'
        };

        function loadEvents() {
            IremeAPI.getSchoolEvents().then(function(data) {
                var events = data.events || [];
                var now = new Date();
                var upcoming = events.filter(function(e) { return new Date(e.date) >= now; });
                var past = events.filter(function(e) { return new Date(e.date) < now; });

                upcoming.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });

                displayEvents(upcoming, 'events-list', 'events-empty');
            }).catch(function(err) {
                console.error('Failed to load events:', err);
                document.getElementById('events-list').innerHTML = '';
                document.getElementById('events-empty').style.display = 'block';
            });
        }

        function displayEvents(events, containerId, emptyId) {
            var container = document.getElementById(containerId);
            var emptyState = document.getElementById(emptyId);

            if (events.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            var html = events.map(function(e) {
                var date = new Date(e.date);
                var day = date.getDate();
                var month = date.toLocaleString('en', { month: 'short' }).toUpperCase();
                var icon = typeIcons[e.type] || 'fa-calendar';
                var color = typeColors[e.type] || 'bg-secondary';

                return '<div class="event-card bg-white rounded shadow-sm p-3 mb-3">' +
                    '<div class="d-flex gap-3 align-items-start">' +
                    '<div class="event-date-badge flex-shrink-0">' +
                    '<div class="day">' + day + '</div>' +
                    '<div class="month">' + month + '</div>' +
                    '</div>' +
                    '<div class="flex-grow-1">' +
                    '<div class="d-flex align-items-center gap-2 mb-1">' +
                    '<span class="badge ' + color + '"><i class="fa ' + icon + ' me-1"></i>' + (e.type || 'Event') + '</span>' +
                    '</div>' +
                    '<h6 class="mb-1">' + (e.name || e.title || 'Event') + '</h6>' +
                    (e.description ? '<p class="text-muted small mb-1">' + e.description + '</p>' : '') +
                    '<small class="text-muted">' +
                    (e.time ? '<i class="fa fa-clock me-1"></i>' + e.time + ' ' : '') +
                    (e.location ? '<i class="fa fa-map-marker-alt me-1"></i>' + e.location : '') +
                    '</small>' +
                    '</div>' +
                    '<button class="btn btn-outline-danger btn-sm rounded-circle" onclick="deleteEvent(\'' + e.id + '\')" title="Delete">' +
                    '<i class="fa fa-trash"></i></button>' +
                    '</div></div>';
            }).join('');

            container.innerHTML = html;
        }

        function deleteEvent(id) {
            if (!confirm('Delete this event?')) return;
            IremeAPI.deleteSchoolEvent(id).then(function() {
                loadEvents();
            }).catch(function(err) {
                alert('Failed to delete event: ' + (err.message || 'Unknown error'));
            });
        }

        document.getElementById('event-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var errorDiv = document.getElementById('form-error');
            var successDiv = document.getElementById('form-success');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            var data = {
                name: document.getElementById('event-name').value,
                type: document.getElementById('event-type').value,
                date: document.getElementById('event-date').value,
                time: document.getElementById('event-time').value || null,
                location: document.getElementById('event-location').value || null,
                description: document.getElementById('event-description').value || null
            };

            IremeAPI.createSchoolEvent(data).then(function() {
                successDiv.textContent = IremeI18n.t('schoolEvents.success');
                successDiv.style.display = 'block';
                document.getElementById('event-form').reset();
                loadEvents();
            }).catch(function(err) {
                errorDiv.textContent = err.message || 'Failed to post event';
                errorDiv.style.display = 'block';
            });
        });

        loadEvents();
    </script>
</body>
</html>
