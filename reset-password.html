<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Reset Password</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-8 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-3 animated slideInRight">Reset Password</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page">Reset Password</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Form Start -->
    <div class="container-fluid py-5">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    <div class="bg-light rounded p-4 p-lg-5 wow fadeIn" data-wow-delay="0.1s">
                        <div class="text-center mb-4">
                            <div class="btn-square bg-primary rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width:64px;height:64px">
                                <i class="fa fa-lock text-white fa-lg"></i>
                            </div>
                            <h4 class="mb-1">Set New Password</h4>
                            <p class="text-muted small">Enter your new password below</p>
                        </div>

                        <form id="reset-form">
                            <div class="mb-3">
                                <label class="form-label fw-bold">New Password</label>
                                <input type="password" id="new-password" class="form-control form-control-lg" minlength="8" required>
                                <small class="text-muted">Minimum 8 characters</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Confirm Password</label>
                                <input type="password" id="confirm-password" class="form-control form-control-lg" minlength="8" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3">
                                <i class="fa fa-check me-2"></i>Reset Password
                            </button>
                        </form>

                        <div id="form-error" class="alert alert-danger mt-3" style="display:none"></div>
                        <div id="form-success" class="alert alert-success mt-3" style="display:none"></div>

                        <div class="text-center mt-3">
                            <a href="login.html" class="text-decoration-none small">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Form End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        IremeComponents.initPage('reset-password.html');

        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');

        document.getElementById('reset-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var errorDiv = document.getElementById('form-error');
            var successDiv = document.getElementById('form-success');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            var newPass = document.getElementById('new-password').value;
            var confirmPass = document.getElementById('confirm-password').value;

            if (newPass !== confirmPass) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            if (!token) {
                errorDiv.textContent = 'Invalid or expired reset link. Please request a new one.';
                errorDiv.style.display = 'block';
                return;
            }

            IremeAPI.post('/api/auth/reset-password', { token: token, password: newPass }).then(function() {
                successDiv.textContent = 'Password reset successfully! Redirecting to login...';
                successDiv.style.display = 'block';
                document.getElementById('reset-form').reset();
                setTimeout(function() { window.location.href = 'login.html'; }, 2000);
            }).catch(function(err) {
                errorDiv.textContent = err.message || 'Failed to reset password. The link may have expired.';
                errorDiv.style.display = 'block';
            });
        });
    </script>
</body>
</html>
