<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Amasomo - IREME</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Header Start -->
    <div class="container-fluid bg-primary py-5 hero-header mb-5">
        <div class="container py-5">
            <div class="row g-5 pt-5">
                <div class="col-12 text-center text-lg-start">
                    <div class="btn btn-sm border rounded-pill text-white px-3 mb-3 animated slideInRight" data-i18n="lessons.badge">Amasomo</div>
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="lessons.title">Amasomo y'Icyiciro Cyawe</h1>
                    <p class="text-white mb-4 animated slideInRight" data-i18n="lessons.desc">Reba amasomo ahuye n'icyiciro cyawe, isomo, n'umutwe.</p>
                </div>
            </div>
        </div>
    </div>
    <!-- Header End -->

    <!-- Lessons Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <!-- Filters -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <select id="lesson-level" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="lessons.selectLevel">Hitamo Icyiciro</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="lesson-subject" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="lessons.selectSubject">Hitamo Isomo</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="lesson-grade" class="form-select rounded-pill px-4 py-2">
                        <option value="" data-i18n="lessons.selectGrade">Hitamo Umwaka</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="text" id="lesson-search" class="form-control rounded-pill px-4 py-2" placeholder="Shakisha isomo..." data-i18n="lessons.search">
                </div>
            </div>

            <!-- Lessons List -->
            <div id="lessons-list" class="row g-4">
                <!-- Lessons will be loaded here -->
            </div>

            <!-- Empty State -->
            <div id="lessons-empty" class="text-center py-5" style="display: none;">
                <i class="fa fa-book-open fa-3x text-primary mb-3"></i>
                <h3 data-i18n="lessons.noLessons">Nta masomo ari hano</h3>
                <p class="text-muted" data-i18n="lessons.noLessonsDesc">Gerageza guhindura ibyo ushakisha cyangwa icyiciro.</p>
            </div>

            <!-- Loading State -->
            <div id="lessons-loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted" data-i18n="lessons.loading">Gutegereza...</p>
            </div>
        </div>
    </div>
    <!-- Lessons End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js?v=2"></script>
    <script src="lib/wow/wow.min.js?v=2"></script>
    <script src="lib/easing/easing.min.js?v=2"></script>
    <script src="lib/waypoints/waypoints.min.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/i18n.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script>
        // Check authentication
        if (!IremeAuth.isAuthenticated()) {
            window.location.href = 'student-login.html';
        }

        // Load filters
        function loadFilters() {
            IremeAPI.getCurriculumLevels().then(function(data) {
                var levels = data.levels || [];
                var select = document.getElementById('lesson-level');
                levels.forEach(function(level) {
                    var option = document.createElement('option');
                    option.value = level.id;
                    option.textContent = level.nameEn || level.name;
                    select.appendChild(option);
                });
            });

            IremeAPI.getCurriculumSubjects().then(function(data) {
                var subjects = data.subjects || [];
                var select = document.getElementById('lesson-subject');
                subjects.forEach(function(subject) {
                    var option = document.createElement('option');
                    option.value = subject.id;
                    option.textContent = subject.nameEn || subject.name;
                    select.appendChild(option);
                });
            });
        }

        // Load lessons
        function loadLessons() {
            var level = document.getElementById('lesson-level').value;
            var subject = document.getElementById('lesson-subject').value;
            var grade = document.getElementById('lesson-grade').value;
            var search = document.getElementById('lesson-search').value;

            // For now, show a placeholder message
            // In production, this would call a lessons API
            document.getElementById('lessons-loading').style.display = 'none';
            document.getElementById('lessons-empty').style.display = 'block';
        }

        // Event listeners
        document.getElementById('lesson-level').addEventListener('change', loadLessons);
        document.getElementById('lesson-subject').addEventListener('change', loadLessons);
        document.getElementById('lesson-grade').addEventListener('change', loadLessons);
        document.getElementById('lesson-search').addEventListener('input', loadLessons);

        // Initialize
        IremeComponents.initPage('video-lessons.html');
        loadFilters();
        loadLessons();
    </script>
</body>

</html>
