<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IREME - Parent Meetings</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/ireme-icon.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .meeting-card { transition: all 0.3s; border-left: 4px solid var(--primary); }
        .meeting-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .meeting-card.emergency { border-left-color: #e35656; }
        .meeting-card.general { border-left-color: var(--primary); }
        .meeting-card.class-specific { border-left-color: #12B981; }
        .meeting-card.individual { border-left-color: #ffc107; }
    </style>
</head>
<body>
    <div id="component-spinner"></div>
    <div id="component-navbar"></div>

    <!-- Hero Start -->
    <div class="container-fluid pt-5 bg-primary hero-header">
        <div class="container pt-5">
            <div class="row g-5 pt-5">
                <div class="col-lg-6 align-self-center text-center text-lg-start mb-lg-5">
                    <h1 class="display-4 text-white mb-4 animated slideInRight" data-i18n="parentMeetings.title">Parent Meetings</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center justify-content-lg-start mb-0">
                            <li class="breadcrumb-item"><a class="text-white" href="index.html" data-i18n="breadcrumb.home">Home</a></li>
                            <li class="breadcrumb-item text-white active" aria-current="page" data-i18n="parentMeetings.title">Parent Meetings</li>
                        </ol>
                    </nav>
                </div>
                <div class="col-lg-6 align-self-end text-center text-lg-end">
                    <img class="img-fluid" src="img/hero-img.png" alt="" style="max-height: 300px;">
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Content Start -->
    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4">
                <!-- Schedule Meeting Form -->
                <div class="col-lg-5 wow fadeInUp" data-wow-delay="0.1s">
                    <div class="bg-light rounded p-4">
                        <h4 class="mb-4"><i class="fa fa-handshake text-primary me-2"></i><span data-i18n="parentMeetings.title">Announce Meeting</span></h4>
                        <form id="meeting-form">
                            <div class="mb-3">
                                <label class="form-label fw-bold" data-i18n="parentMeetings.meetingTitle">Meeting Title</label>
                                <input type="text" id="meeting-title" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold" data-i18n="parentMeetings.meetingType">Meeting Type</label>
                                <select id="meeting-type" class="form-select" required>
                                    <option value="GENERAL" data-i18n="parentMeetings.general">General Meeting</option>
                                    <option value="CLASS_SPECIFIC" data-i18n="parentMeetings.classSpecific">Class-Specific</option>
                                    <option value="INDIVIDUAL" data-i18n="parentMeetings.individual">Individual Meeting</option>
                                    <option value="EMERGENCY" data-i18n="parentMeetings.emergency">Emergency Meeting</option>
                                </select>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold" data-i18n="parentMeetings.date">Meeting Date</label>
                                    <input type="date" id="meeting-date" class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold" data-i18n="parentMeetings.time">Meeting Time</label>
                                    <input type="time" id="meeting-time" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold" data-i18n="parentMeetings.location">Location</label>
                                <input type="text" id="meeting-location" class="form-control" placeholder="e.g., School Hall or Zoom Link">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold" data-i18n="parentMeetings.agenda">Agenda</label>
                                <textarea id="meeting-agenda" class="form-control" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3">
                                <i class="fa fa-bullhorn me-2"></i>
                                <span data-i18n="parentMeetings.submit">Announce Meeting</span>
                            </button>
                        </form>
                        <div id="form-error" class="alert alert-danger mt-3" style="display:none"></div>
                        <div id="form-success" class="alert alert-success mt-3" style="display:none"></div>
                    </div>
                </div>

                <!-- Meetings List -->
                <div class="col-lg-7 wow fadeInUp" data-wow-delay="0.3s">
                    <h4 class="mb-4" data-i18n="parentMeetings.upcoming">Upcoming Meetings</h4>
                    <div id="meetings-list">
                        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
                    </div>
                    <div id="meetings-empty" class="text-center py-5" style="display:none">
                        <i class="fa fa-calendar-times fa-3x text-muted mb-3"></i>
                        <h4 data-i18n="parentMeetings.noMeetings">No meetings scheduled</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Content End -->

    <div id="component-footer"></div>
    <div id="component-backtotop"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        IremeComponents.initPage('parent-meetings.html');
        IremeAuth.requireAuth();

        var typeLabels = {
            GENERAL: 'General',
            CLASS_SPECIFIC: 'Class-Specific',
            INDIVIDUAL: 'Individual',
            EMERGENCY: 'Emergency'
        };

        function loadMeetings() {
            IremeAPI.getParentMeetings().then(function(data) {
                var meetings = data.meetings || [];
                var now = new Date();
                var upcoming = meetings.filter(function(m) { return new Date(m.date) >= now; });
                upcoming.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
                displayMeetings(upcoming);
            }).catch(function(err) {
                console.error('Failed to load meetings:', err);
                document.getElementById('meetings-list').innerHTML = '';
                document.getElementById('meetings-empty').style.display = 'block';
            });
        }

        function displayMeetings(meetings) {
            var container = document.getElementById('meetings-list');
            var emptyState = document.getElementById('meetings-empty');

            if (meetings.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            var html = meetings.map(function(m) {
                var date = new Date(m.date);
                var dateStr = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                var typeClass = (m.type || 'general').toLowerCase().replace('_', '-');
                var typeLabel = typeLabels[m.type] || m.type || 'General';

                return '<div class="meeting-card ' + typeClass + ' bg-white rounded shadow-sm p-4 mb-3">' +
                    '<div class="d-flex justify-content-between align-items-start mb-2">' +
                    '<div>' +
                    '<span class="badge bg-primary mb-2">' + typeLabel + '</span>' +
                    '<h5 class="mb-1">' + (m.title || 'Meeting') + '</h5>' +
                    '</div>' +
                    '</div>' +
                    '<div class="mb-2">' +
                    '<p class="text-muted small mb-1"><i class="fa fa-calendar me-1"></i> ' + dateStr + '</p>' +
                    '<p class="text-muted small mb-1"><i class="fa fa-clock me-1"></i> ' + (m.time || '') + '</p>' +
                    (m.location ? '<p class="text-muted small mb-1"><i class="fa fa-map-marker-alt me-1"></i> ' + m.location + '</p>' : '') +
                    '</div>' +
                    (m.agenda ? '<div class="bg-light rounded p-2 mt-2"><small class="fw-bold">Agenda:</small><p class="small mb-0 mt-1">' + m.agenda + '</p></div>' : '') +
                    (m.rsvpCount !== undefined ? '<div class="mt-2"><small class="text-muted"><i class="fa fa-users me-1"></i> ' + m.rsvpCount + ' ' + IremeI18n.t('parentMeetings.attendees') + '</small></div>' : '') +
                    '</div>';
            }).join('');

            container.innerHTML = html;
        }

        document.getElementById('meeting-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var errorDiv = document.getElementById('form-error');
            var successDiv = document.getElementById('form-success');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            var data = {
                title: document.getElementById('meeting-title').value,
                type: document.getElementById('meeting-type').value,
                date: document.getElementById('meeting-date').value,
                time: document.getElementById('meeting-time').value,
                location: document.getElementById('meeting-location').value || null,
                agenda: document.getElementById('meeting-agenda').value
            };

            IremeAPI.createParentMeeting(data).then(function() {
                successDiv.textContent = IremeI18n.t('parentMeetings.success');
                successDiv.style.display = 'block';
                document.getElementById('meeting-form').reset();
                loadMeetings();
            }).catch(function(err) {
                errorDiv.textContent = err.message || 'Failed to announce meeting';
                errorDiv.style.display = 'block';
            });
        });

        loadMeetings();
    </script>
</body>
</html>
